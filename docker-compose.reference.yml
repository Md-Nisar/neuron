# Reference stack (ADR 0012 decision 3): the system under test for every v0.9.0 load,
# security (DAST) and disaster-recovery number. Two API replicas share one Postgres, so rate
# limits, the token budget and run leases cross instances, behind the local Keycloak.
#
#   NEURON_IMAGE=neuron:ref make reference-up      # image built from the release commit
#   make reference-down
#
# It is not a deployment: no number measured here is hosted capacity. Every port binds to
# loopback. The image is passed in, never built here, so the digest can be recorded.
#
# The production settings profile is used wherever validation allows it locally. Each
# relaxation is listed here with its reason:
#   - APP_ENV=development, not production. The fake model's latency settings (the load
#     profile) are refused in staging/production by design, and production requires an
#     HTTPS identity provider on a public host and Postgres with sslmode=verify-full, none
#     of which exist on a laptop or CI host.
#   - Postgres is reached over the compose network without TLS (ADR 0012 open question 5):
#     sslmode=disable. The roles, grants and `setup` step are the production ones.
#   - The JWKS is fetched over http from the Keycloak container; the issuer claim stays the
#     host-visible http://localhost:8180 URL, as in the development stack.
#   - No provider key is set, so the fake model with latency answers (load never targets the
#     NVIDIA API, ADR 0012 decision 4). Live evals run separately (`neuron-eval`).
#   - Throwaway credentials, local use only.
x-api: &api
  image: ${NEURON_IMAGE:?set NEURON_IMAGE to the image to test, for example neuron:ref}
  pull_policy: never
  restart: "no"
  depends_on:
    setup:
      condition: service_completed_successfully
    keycloak:
      condition: service_healthy
  # Uploaded files (RAG-08.04): one volume shared by both replicas and the worker, so a file
  # uploaded through either replica is the one the worker parses.
  volumes:
    - knowledge-blobs:/var/lib/neuron/knowledge-blobs
  environment: &api-env
    APP_ENV: development
    APP_AUTH_MODE: jwt
    APP_AUTH_ISSUER: http://localhost:8180/realms/neuron
    APP_AUTH_AUDIENCE: neuron-api
    APP_AUTH_JWKS_URL: http://keycloak:8080/realms/neuron/protocol/openid-connect/certs
    APP_AUTH_ALGORITHMS: '["RS256"]'
    APP_AUTH_ROLE_PERMISSIONS: '{"neuron-user":["agent:approve","agent:invoke","data:erase","feedback:write","knowledge:admin","knowledge:read","knowledge:write","memories:read","memories:write","threads:delete","threads:read","threads:write","tools:calculator","tools:forget","tools:get_document_excerpt","tools:list_knowledge_bases","tools:recall","tools:remember","tools:search_knowledge"],"neuron-reader":["threads:read"]}'
    APP_IDENTITY_HASH_KEY: reference-stack-identity-key-local-only-0001
    APP_CHECKPOINTER: postgres
    APP_MEMORY_ENABLED: "true"
    # Off unless set; with it on, `--profile knowledge` adds the ingestion worker (RAG-02.01).
    APP_KNOWLEDGE_ENABLED: ${KNOWLEDGE_ENABLED:-false}
    APP_KNOWLEDGE_BLOB_ROOT: /var/lib/neuron/knowledge-blobs
    # No provider key on this stack: the fake embedding provider, as for the chat model.
    APP_KNOWLEDGE_EMBEDDING_PROVIDER: ${KNOWLEDGE_EMBEDDING_PROVIDER:-fake}
    APP_LIMITS_BACKEND: postgres
    APP_POSTGRES_DSN: postgresql://neuron_app:app-local-only@postgres:5432/neuron?sslmode=disable
    APP_ALLOWED_HOSTS: '["localhost","127.0.0.1","api1","api2"]'
    APP_TRUSTED_PROXIES: '[]'
    APP_RATE_LIMIT_ENABLED: "true"
    # Load relaxation: with the default 100,000 tokens/hour a load user exhausts its budget
    # within minutes and the run rate measures the budget, not the stack (first baseline try).
    APP_USER_TOKEN_BUDGET: "10000000"
    APP_FAKE_MODEL_TTFT_MS: ${FAKE_TTFT_MS:-800}
    APP_FAKE_MODEL_TOKENS_PER_SECOND: ${FAKE_TOKENS_PER_SECOND:-40}
    APP_FAKE_MODEL_OUTPUT_TOKENS: ${FAKE_OUTPUT_TOKENS:-200}
    # Browser origins allowed to call the API (a JSON list). Empty by default; set it to
    # ["http://localhost:5173"] to use the web app from `make web-dev` against this stack.
    APP_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-[]}

services:
  postgres:
    # PostgreSQL 16 with pgvector (ADR 0014, RAG-01.01); knowledge stays off unless enabled.
    image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
    # Parallel HNSW index builds need more than Docker's 64 MB default /dev/shm (RAG-00.02).
    shm_size: 256mb
    environment:
      POSTGRES_USER: neuron_owner
      POSTGRES_PASSWORD: owner-local-only
      POSTGRES_DB: neuron
    # WAL archiving, so the restore drill (scripts/dr_drill.py) can recover to a point in time.
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f
      - -c
      - archive_timeout=10
    volumes:
      - ./deploy/reference/init-roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
      - ./deploy/reference/init-knowledge.sql:/docker-entrypoint-initdb.d/20-knowledge.sql:ro
      - ./deploy/reference/init-archive.sh:/docker-entrypoint-initdb.d/05-archive.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuron_owner -d neuron"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:5433:5432"

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:3f3c5f8e03c614774b4bd9173b88391fefa4153bfc010d8012d59ad825377332
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-local-only
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./deploy/keycloak/neuron-realm.json:/opt/keycloak/data/import/neuron-realm.json:ro
      # The realm's `neuron` login theme; build it first (keycloak-theme/README.md).
      - ./keycloak-theme/dist_keycloak:/opt/keycloak/providers:ro
    ports:
      - "127.0.0.1:8180:8080"
    healthcheck:
      # The image has no curl; a bare TCP request to the realm endpoint is enough.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/neuron HTTP/1.0\\r\\nHost: localhost:8180\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q '200'"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  # The pre-deploy step: schema, migrations and the app role's grants, as the migrator.
  setup:
    image: ${NEURON_IMAGE:?set NEURON_IMAGE to the image to test, for example neuron:ref}
    pull_policy: never
    restart: "no"
    command: ["python", "-m", "neuron_agent.persistence.cli", "setup"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *api-env
      APP_POSTGRES_MIGRATION_DSN: postgresql://neuron_migrator:migrator-local-only@postgres:5432/neuron?sslmode=disable

  api1:
    <<: *api
    ports:
      - "127.0.0.1:8101:8000"

  api2:
    <<: *api
    ports:
      - "127.0.0.1:8102:8000"

  # KNOWLEDGE_ENABLED=true docker compose -f docker-compose.reference.yml --profile knowledge up
  worker:
    image: ${NEURON_IMAGE:?set NEURON_IMAGE to the image to test, for example neuron:ref}
    pull_policy: never
    restart: unless-stopped
    profiles: ["knowledge"]
    command: ["neuron-worker"]
    # SIGTERM drains for APP_WORKER_DRAIN_SECONDS (30 s); Docker must wait longer than that.
    stop_grace_period: 40s
    depends_on:
      setup:
        condition: service_completed_successfully
      docling:
        condition: service_healthy
    # Postgres on the default network; docling-serve only on `parser`.
    networks: [default, parser]
    # Its own settings only: the worker parses untrusted files, so it never holds the app or
    # migration DSN, the identity key or the API's auth settings.
    environment:
      APP_ENV: development
      APP_POSTGRES_WORKER_DSN: postgresql://neuron_worker@postgres:5432/neuron?sslmode=disable
      APP_KNOWLEDGE_PARSER_URL: http://docling:5001
      APP_KNOWLEDGE_BLOB_ROOT: /var/lib/neuron/knowledge-blobs
      APP_KNOWLEDGE_EMBEDDING_PROVIDER: ${KNOWLEDGE_EMBEDDING_PROVIDER:-fake}
      # libpq reads the password from here (the throwaway one from init-roles.sql).
      PGPASSWORD: worker-local-only
    volumes:
      - knowledge-blobs:/var/lib/neuron/knowledge-blobs
    healthcheck:
      test: ["CMD", "neuron-worker", "health"]
      interval: 10s
      # The command imports the package, which takes about 4 s on a small machine.
      timeout: 10s
      start_period: 20s
      retries: 3

  # PDF and Office parsing (ADR 0014 K2; RAG-02.02), the image the spike measured, models
  # included. It parses hostile files, so it is only on `parser`, an internal network with no
  # route out (the weights in the image are all it has), publishes no port, and runs read-only
  # without capabilities. Its API has no auth: the worker, which listens on nothing, is the only
  # other service on `parser`.
  docling:
    image: quay.io/docling-project/docling-serve-cpu@sha256:7a480a1604fa3b42efeddc7db9527690d9f9bc903226136013e2bfe6b1a4dfb0
    restart: unless-stopped
    profiles: ["knowledge"]
    networks: [parser]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      DOCLING_SERVE_ENABLE_UI: "false"
      DOCLING_SERVE_ENABLE_REMOTE_SERVICES: "false"
      DOCLING_SERVE_ALLOW_EXTERNAL_PLUGINS: "false"
      # The synchronous endpoint waits as long as the worker's deadline (default 120 s).
      DOCLING_SERVE_MAX_SYNC_WAIT: "900"
      HF_HUB_OFFLINE: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 3

networks:
  parser:
    internal: true

volumes:
  knowledge-blobs:
