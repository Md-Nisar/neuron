# RAG-00.02 spike only (branch RAG-00.02-spike, never merged). Throwaway passwords.
services:
  db:
    image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
    environment:
      POSTGRES_DB: neuron
      POSTGRES_PASSWORD: spike-superuser
    volumes:
      - ../deploy/reference/init-roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    shm_size: 4gb  # parallel HNSW builds use dynamic shared memory (64 MB default fails)
    ports: ["127.0.0.1:55432:5432"]
    command: ["postgres", "-c", "shared_buffers=1GB", "-c", "maintenance_work_mem=1GB", "-c", "max_connections=200"]
  docling:
    image: quay.io/docling-project/docling-serve-cpu:latest
    ports: ["127.0.0.1:55001:5001"]
    profiles: ["docling"]
