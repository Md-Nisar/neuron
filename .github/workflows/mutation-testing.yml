name: mutation-testing

# Do the tests catch bugs, or only pass? Mutation testing plants small faults in the
# security-critical code and reports the ones no test notices (surviving mutants).
# Report-only for now: review survivors and add tests; make it blocking once the score is stable.
on:
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutmut:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - run: |
          uv python install 3.13
          uv sync
      # No continue-on-error: a mutmut crash (nonzero exit) must fail the job. Surviving mutants
      # do not change the exit code (mutmut exits 0), so they stay report-only.
      - name: Run mutation testing on security/ and tools/
        run: uv run --with "mutmut==3.8.0" mutmut run
      - name: Summarize mutants
        if: always()
        run: |
          uv run --with "mutmut==3.8.0" mutmut results --all true > mutmut-results.txt || true
          if uv run --with "mutmut==3.8.0" mutmut export-cicd-stats && test -f mutants/mutmut-cicd-stats.json; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          s = json.load(open("mutants/mutmut-cicd-stats.json"))
          print("## Mutation testing")
          print(f"- total mutants: {s['total']}")
          print(f"- killed: {s['killed']}")
          print(f"- survived: {s['survived']} (report only)")
          print(f"- other (timeout, suspicious, no tests, skipped, not checked): {s['total'] - s['killed'] - s['survived']}")
          PY
            # Zero generated or zero tested mutants means the job tested nothing: fail it.
            python3 -c "import json,sys; s=json.load(open('mutants/mutmut-cicd-stats.json')); sys.exit(0 if s['killed'] + s['survived'] > 0 else 1)" \
              || { echo "::error::mutmut generated or tested no mutants"; exit 1; }
          else
            echo "::error::mutmut produced no results"
            echo "## Mutation testing: no results (mutmut crashed)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutmut-results
          path: mutmut-results.txt
          retention-days: 30
