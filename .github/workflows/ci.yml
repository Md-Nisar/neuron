name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv python install 3.13
      - run: uv sync
      - run: uv run python -m ruff format --check src tests
      - run: uv run python -m ruff check src tests
      - run: uv run python -m mypy src scripts/dev_token.py
      - run: uv run python -m pytest tests/unit tests/graph tests/security tests/resilience tests/evals
      # The dependency audit is platform-independent and `make` isn't on Windows runners.
      - if: runner.os == 'Linux'
        run: make security
