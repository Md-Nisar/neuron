name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.13
      - run: uv sync
      - run: uv run python -m ruff format --check src tests
      - run: uv run python -m ruff check src tests
      - run: uv run python -m mypy src
      - run: uv run python -m pytest tests/unit tests/graph tests/security tests/evals
      - run: uv run python -m bandit -q -r src
