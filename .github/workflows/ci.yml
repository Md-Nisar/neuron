name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A full run takes about 4 minutes; a hung test then fails the job and its log is readable,
    # instead of holding the runner for GitHub's 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv python install 3.13
      - run: uv sync
      - run: uv run python -m ruff format --check src tests
      - run: uv run python -m ruff check src tests
      - run: uv run python -m mypy src scripts/dev_token.py scripts/validate_observability.py scripts/flow_report.py tests/conftest.py tests/graph tests/resilience tests/e2e tests/evals
      - run: uv run python -m pytest tests/unit tests/graph tests/security tests/resilience tests/e2e tests/evals
      # The dependency audit is platform-independent and `make` isn't on Windows runners.
      - if: runner.os == 'Linux'
        run: make security

  # The web application (ADR 0010). Installs from the lockfile only; the Node version comes from
  # web/.nvmrc and the package manager from web/package.json.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=low

  # The Keycloak login theme (keycloak-theme/). Builds the real theme JAR, so a broken theme cannot
  # reach the sign-in page unnoticed. Needs Maven and a JDK, which ubuntu-latest provides.
  keycloak-theme:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: keycloak-theme
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: keycloak-theme/.nvmrc
          cache: npm
          cache-dependency-path: keycloak-theme/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build-keycloak-theme
      - run: npm audit --audit-level=low

  # Browser end to end (Chromium): the built web app, a real API process on the fake model and a
  # stand-in sign-in provider, all on loopback. No secret, no provider call.
  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv python install 3.13
      - run: uv sync
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
        env:
          CI: "true"
      # A report, not a gate: which flows have API and browser end-to-end tests. Always exits 0.
      - if: always()
        run: uv run python scripts/flow_report.py

  # The knowledge flow in the browser (RAG-06.01): the same stand-ins as `web-e2e`, with the API on
  # Postgres (pgvector, the reference stack's roles), `setup` and the ingestion worker. The fake
  # embedding provider and a text file keep it offline: no provider call, no docling-serve.
  web-e2e-knowledge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # The same image and digest as postgres-integration.yml.
      POSTGRES_IMAGE: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
      # The DSNs are set by the first step, with passwords generated for this run only.
      APP_ENV: development
      APP_CHECKPOINTER: postgres
      APP_MEMORY_ENABLED: "true"
      APP_KNOWLEDGE_ENABLED: "true"
      APP_KNOWLEDGE_EMBEDDING_PROVIDER: fake
      APP_IDENTITY_HASH_KEY: browser-e2e-identity-hash-key-not-a-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start Postgres with the reference roles
        run: |
          set -euo pipefail
          docker run -d --name postgres -p 127.0.0.1:5432:5432 -e POSTGRES_PASSWORD=ci-only-throwaway \
            -e POSTGRES_DB=neuron "$POSTGRES_IMAGE"
          for _ in $(seq 30); do
            docker exec postgres pg_isready -h 127.0.0.1 -U postgres && break
            sleep 2
          done
          for sql in init-roles.sql init-knowledge.sql; do
            docker exec -i postgres psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d neuron \
              < "deploy/reference/$sql"
          done
          # Replace the roles' fixed reference passwords with ones made for this run.
          for pair in APP_POSTGRES_MIGRATION_DSN:neuron_migrator APP_POSTGRES_DSN:neuron_app \
            APP_POSTGRES_WORKER_DSN:neuron_worker; do
            role="${pair#*:}"
            password="$(openssl rand -hex 24)"
            echo "::add-mask::$password"
            docker exec postgres psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d neuron \
              -c "ALTER ROLE $role PASSWORD '$password'"
            echo "${pair%%:*}=postgresql://$role:$password@127.0.0.1:5432/neuron?sslmode=disable" \
              >> "$GITHUB_ENV"
          done
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv python install 3.13
      # Locked versions only; the later steps use the synced environment directly.
      - run: uv sync --locked
      - run: .venv/bin/python -m neuron_agent.persistence.cli setup
      - name: Start the ingestion worker
        run: |
          nohup .venv/bin/neuron-worker > worker.log 2>&1 &
          for _ in $(seq 30); do .venv/bin/neuron-worker health && exit 0; sleep 2; done
          cat worker.log >&2
          exit 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: node_modules/.bin/playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e:knowledge
        working-directory: web
        env:
          CI: "true"
      - if: failure()
        run: tail -n 200 worker.log

  # The one-command local stack (RAG-08.04): `docker compose up --build` from a clean checkout,
  # then upload -> ask -> cite through the API as the realm's throwaway user `alice`. No provider
  # key, so the fake model and fake embeddings keep it offline; docling-serve is not started.
  local-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 600
      - name: Upload, ask and cite
        run: |
          set -euo pipefail
          token="$(sh scripts/reference_token.sh alice)"
          echo "::add-mask::$token"
          SMOKE_TEST_TOKEN="$token" python3 scripts/smoke_test.py --knowledge http://127.0.0.1:8000
      - if: failure()
        run: docker compose ps --all && docker compose logs --no-color --tail 200
      - if: always()
        run: docker compose down --volumes

  # Runs the real `promtool` and `otelcol-contrib` (pinned by version and SHA-256 in the script)
  # on the alert rules and the Collector config. Standard library Python only; no secret.
  observability-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate alert rules and Collector config
        run: python3 scripts/validate_observability.py check --bin-dir "$RUNNER_TEMP/validators"
      - name: Both validators reject a broken file
        run: python3 scripts/validate_observability.py reject-broken --bin-dir "$RUNNER_TEMP/validators"
