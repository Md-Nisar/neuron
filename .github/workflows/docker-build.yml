name: docker-build

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - .github/workflows/docker-build.yml

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Build only: nothing is pushed, and there is no registry login.
      - run: docker build -t neuron-test .
      # The venv's interpreter must resolve in the runtime stage; the defaults need no env.
      - run: docker run --rm --entrypoint python neuron-test -c "import neuron_agent, neuron_agent.api.main; from neuron_agent.prompts.loader import load_prompt; assert load_prompt('system/main.md'); print(neuron_agent.__version__)"
