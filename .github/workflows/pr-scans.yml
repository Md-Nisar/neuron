name: pr-scans

# The code scans of the deterministic gates (docs/AI_CODE_VERIFICATION.md): secrets and
# dependencies. They read only the code, so they run on new commits and a change of base
# branch, not on the label and description edits that re-run ai-code-verification.yml. A separate workflow, so that an edit
# cancelling an ai-code-verification run can never cancel a scan.
# `edited` is here only for a change of base branch, which changes the diff under review; the jobs
# skip every other edit.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

# An edit that leaves the base branch alone runs in a group of its own, so its skipped run can
# never cancel a scan and stand in for it as a passing check.
concurrency:
  group: >-
    pr-scans-${{ github.event.pull_request.number }}-${{
    github.event.action == 'edited' && github.event.changes.base == null && github.run_id || 'scan' }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    if: github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  dependency-review:
    # Known-vulnerable or disallowed-license dependencies introduced by the PR.
    # Needs the dependency graph (on by default for public repos; GitHub Advanced Security
    # for private ones).
    if: github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: AGPL-3.0, GPL-3.0
