name: image-publish

# Builds, pushes, scans and attests the image for every push to main (ADR 0008 decision 6,
# steps 2-4). Pull requests never reach this workflow: they are built, without a push, by
# docker-build.yml. This is the only workflow with `id-token: write` or `attestations: write`
# (tests/unit/test_workflows.py); the attestation's signer is this file, which deploy jobs pin
# with `gh attestation verify --signer-workflow` (OPERATIONS.md, "Verify an image").
on:
  push:
    branches: [main]

permissions: {}

# Never cancel a run half way through a push or an attestation.
concurrency:
  group: image-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/md-nisar/neuron

jobs:
  build-push:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the version
        id: version
        run: echo "value=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The build arguments are labels only (revision, version), never a secret: provenance
      # mode=max records them. `digest` is the digest of the pushed manifest list.
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=${{ steps.version.outputs.value }}
      - name: Record the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Image pushed"
            echo
            echo "\`$IMAGE@$DIGEST\` (tag \`sha-$GITHUB_SHA\`). Scan and attestation follow in later jobs."
          } >> "$GITHUB_STEP_SUMMARY"

  scan:
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      # Needed for .trivyignore.yaml only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Fails on any fixable HIGH or CRITICAL finding that .trivyignore.yaml does not list.
      # Trivy downloads its vulnerability database on every run (cache is off, so a cached copy
      # can never stand in), and an update that fails fails the scan (Trivy's database update is never skipped).
      - name: Scan the pushed digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ needs.build-push.outputs.digest }}
          version: v0.70.0
          cache: false
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore.yaml

  attest:
    needs: [build-push, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ needs.build-push.outputs.digest }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # No predicate input: the action writes SLSA build provenance
      # (https://slsa.dev/provenance/v1). Storage records need an organization-owned
      # repository and the extra artifact-metadata permission, so they are off.
      - name: Attest the digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.build-push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      # The deploy workflow resolves the digest from this run's artifact, never from the
      # mutable `sha-` tag (ADR 0008 decision 6, step 6).
      - name: Write the digest file
        env:
          DIGEST: ${{ needs.build-push.outputs.digest }}
        run: printf '%s@%s\n' "$IMAGE" "$DIGEST" > image-digest.txt
      - name: Keep the digest with this run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest
          path: image-digest.txt
          if-no-files-found: error
          retention-days: 90
      - name: Record the digest
        env:
          DIGEST: ${{ needs.build-push.outputs.digest }}
        run: |
          {
            echo "### Image attested"
            echo
            echo "\`$IMAGE@$DIGEST\`"
            echo
            echo "Verify with \`gh attestation verify oci://$IMAGE@$DIGEST -R $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/image-publish.yml --source-ref refs/heads/main --predicate-type https://slsa.dev/provenance/v1\`"
          } >> "$GITHUB_STEP_SUMMARY"
