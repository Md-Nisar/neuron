name: image-rescan

# image-publish.yml scans each image once, when it is pushed, so a vulnerability published later
# goes unseen while the image stays the newest. Weekly, this rescans the image of the latest
# successful publish on main with the same scanner, settings and ignores (.trivyignore.yaml).
# Read-only: it pulls, never pushes, signs or deletes.
on:
  schedule:
    - cron: "11 5 * * 2"
  workflow_dispatch:

permissions: {}

env:
  IMAGE: ghcr.io/md-nisar/neuron

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      actions: read
    steps:
      # Needed for .trivyignore.yaml only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find the latest published image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/image-publish.yml/runs?branch=main&event=push&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty')
          if ! printf '%s' "$sha" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::No successful image-publish run on main to rescan."
            exit 1
          fi
          echo "ref=$IMAGE:sha-$sha" >> "$GITHUB_OUTPUT"
          echo "Rescanning \`$IMAGE:sha-$sha\`." >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The same settings as image-publish.yml's scan (tests/unit/test_workflows.py keeps them equal).
      - name: Scan the latest published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          version: v0.70.0
          cache: false
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore.yaml
