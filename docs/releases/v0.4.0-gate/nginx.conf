worker_processes 1;
error_log /var/tmp/gate/nginx-error.log;
pid /var/tmp/gate/nginx.pid;
events {}
http {
    access_log /var/tmp/gate/nginx-access.log;
    client_body_temp_path /var/tmp/gate/nginx-tmp;
    proxy_temp_path /var/tmp/gate/nginx-tmp;
    upstream neuron_api { server 127.0.0.1:8000; }
    server {
        listen 127.0.0.1:8080;
        # Verbatim from OPERATIONS.md "Streaming Behind a Reverse Proxy".
        location /v1/agent/stream {
            proxy_pass http://neuron_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 180s;
            gzip off;
        }
        location / {
            proxy_pass http://neuron_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
