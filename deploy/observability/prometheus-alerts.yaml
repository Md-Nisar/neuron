        annotations:
          summary: "structured_output_error above 1.44% of /v1 requests (1h and 5m windows)"
          runbook_url: OPERATIONS.md#runbook-error-classes
      - alert: NeuronErrorClassStructuredOutputError6H
        expr: (sum(rate(neuron_agent_errors_total{error_type="structured_output_error"}[6h])) / sum(rate(http_server_request_duration_seconds_count{http_route=~"/v1/.*"}[6h]))) > 0.006 and (sum(rate(neuron_agent_errors_total{error_type="structured_output_error"}[30m])) / sum(rate(http_server_request_duration_seconds_count{http_route=~"/v1/.*"}[30m]))) > 0.006
        for: 15m
        labels:
