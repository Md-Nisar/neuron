          slo: error_class
          error_type: structured_output_error
          burn_rate: "6"
        annotations:
          summary: "structured_output_error above 0.6% of /v1 requests (6h and 30m windows)"
          runbook_url: OPERATIONS.md#runbook-error-classes
      - alert: NeuronErrorClassToolExecutionError1H
        expr: (sum(rate(neuron_agent_errors_total{error_type="tool_execution_error"}[1h])) / sum(rate(http_server_request_duration_seconds_count{http_route=~"/v1/.*"}[1h]))) > 0.0144 and (sum(rate(neuron_agent_errors_total{error_type="tool_execution_error"}[5m])) / sum(rate(http_server_request_duration_seconds_count{http_route=~"/v1/.*"}[5m]))) > 0.0144
        for: 2m
        labels:
          severity: page
          slo: error_class
          error_type: tool_execution_error
          burn_rate: "14.4"
        annotations:
          summary: "tool_execution_error above 1.44% of /v1 requests (1h and 5m windows)"
          runbook_url: OPERATIONS.md#runbook-error-classes
      - alert: NeuronErrorClassToolExecutionError6H
        expr: (sum(rate(neuron_agent_errors_total{error_type="tool_execution_error"}[6h])) / sum(rate(http_server_request_duration_seconds_count{http_route=~"/v1/.*"}[6h]))) > 0.006 and (sum(rate(neuron_agent_errors_total{error_type="tool_execution_error"}[30m])) / sum(rate(http_server_request_duration_seconds_count{http_route=~"/v1/.*"}[30m]))) > 0.006
