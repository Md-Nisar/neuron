# Static web app for the local stack. Every route that is not a file serves index.html.
server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # Silent token renew loads Keycloak in a hidden frame that redirects back to this origin, so
    # frames from 'self' and Keycloak are allowed, and only this origin may frame the app.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://127.0.0.1:8000 http://localhost:8180; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-src 'self' http://localhost:8180; frame-ancestors 'self'; base-uri 'none'; object-src 'none'; form-action 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
