- name: order_lines
  source: d3_hand.sales.order_lines
  description: Order lines.
  primary_key:
  - order_id
  - line_no
  fields:
  - name: unit_price
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: unit_price
    datatype: Decimal
    description: Agreed price per unit in USD, before the line discount.
  - name: region_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: region_id
    datatype: String
  - name: discount_pct
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: discount_pct
    datatype: Decimal
    description: Line discount in percent (0 to 100).
  - name: line_no
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: line_no
    datatype: Integer
  - name: product_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: product_id
    datatype: Integer
  - name: quantity
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: quantity
    datatype: Integer
  - name: order_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: order_id
    datatype: Integer
  - name: net_amount
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: quantity * unit_price * (1 - discount_pct / 100)
    description: Net line amount in USD after the line discount.
    nonportable_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data:
        entity: sql_attribute
        id: 105902ca-e546-44f7-9b30-9613571fd38b
        ossie_expression: quantity * unit_price * (1 - discount_pct / 100)
        sql: SELECT quantity * unit_price * (1 - discount_pct / 100) AS "net_amount"
          FROM "d3_hand"."sales"."order_lines" AS "order_lines"
        sql_column_is:
        - e5a122b7-dc4c-4e8b-b32a-028920a87836
        - f4d5cc50-c67a-4ac6-b199-f972e7648723
        - 4a3060cb-2f36-4fa6-90ec-402bd5488d9a
        sql_source: manual
        term_id: 65aa8d7c-4b59-42fb-b02e-0993384a998e
