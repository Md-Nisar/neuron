      semantic_layer:
        custom_analyses:
        - description: Revenue divided by the number of completed orders.
          id: 74f01380-a7da-41f3-a929-1c2c71ffb209
          name: average_order_value
          sql: SELECT SUM(order_lines.net_amount) FILTER (WHERE orders.status = 'completed')
            / COUNT(DISTINCT orders.order_id) FILTER (WHERE orders.status = 'completed')
            AS "average_order_value" FROM "d3_hand"."sales"."order_lines" AS "order_lines"
            JOIN "d3_hand"."sales"."orders" AS "orders" ON "order_lines"."order_id"
            = "orders"."order_id"
          sql_column_is:
          - f8cdd4cc-ca4f-42c9-adf1-814271f2c485
          - b856d95e-36c8-4bbe-a31a-c702a3aede4a
          - 211f55ab-6183-4424-9b7f-23ec3df5cdf2
          - 9cfcb9f3-2865-42e5-8e37-ef9336352f58
        - description: Net revenue in USD - net line amounts of completed orders.
            Returns are not deducted.
          id: 7d07b55b-d858-4795-bc50-cc925d7839d5
          name: revenue
          sql: SELECT SUM(order_lines.net_amount) FILTER (WHERE orders.status = 'completed')
            AS "revenue" FROM "d3_hand"."sales"."order_lines" AS "order_lines" JOIN
            "d3_hand"."sales"."orders" AS "orders" ON "order_lines"."order_id" = "orders"."order_id"
          sql_column_is:
          - f8cdd4cc-ca4f-42c9-adf1-814271f2c485
          - b856d95e-36c8-4bbe-a31a-c702a3aede4a
          - 211f55ab-6183-4424-9b7f-23ec3df5cdf2
          - 9cfcb9f3-2865-42e5-8e37-ef9336352f58
        - description: Units on completed orders.
          id: ccf64009-e7e2-458a-957b-f1b90fd55205
          name: units_sold
          sql: SELECT SUM(order_lines.quantity) FILTER (WHERE orders.status = 'completed')
            AS "units_sold" FROM "d3_hand"."sales"."order_lines" AS "order_lines"
            JOIN "d3_hand"."sales"."orders" AS "orders" ON "order_lines"."order_id"
            = "orders"."order_id"
          sql_column_is:
          - f8cdd4cc-ca4f-42c9-adf1-814271f2c485
          - 211f55ab-6183-4424-9b7f-23ec3df5cdf2
