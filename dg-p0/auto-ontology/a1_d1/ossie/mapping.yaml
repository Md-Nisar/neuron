  - expression: supplier_category.supplier_category_id
  link_mappings:
  - object_mapping:
      expression: supplier_category.supplier_category_id
    children:
    - object_mapping:
        concept: DateTime
        expression: supplier_category.valid_from
      relationship: valid_from
    - object_mapping:
        concept: String
        expression: supplier_category.supplier_category_name
      relationship: supplier_category_name
    - object_mapping:
        concept: DateTime
        expression: supplier_category.valid_to
      relationship: valid_to
    - object_mapping:
        concept: Person
        expression: supplier_category.lasteditedby
      relationship: person
- concept: TransactionType
  object_mappings:
  - expression: transaction_type.transaction_type_id
  link_mappings:
  - object_mapping:
      expression: transaction_type.transaction_type_id
    children:
    - object_mapping:
        concept: DateTime
        expression: transaction_type.valid_from
      relationship: valid_from
    - object_mapping:
        concept: String
        expression: transaction_type.transaction_type_name
      relationship: transaction_type_name
    - object_mapping:
        concept: DateTime
        expression: transaction_type.valid_to
      relationship: valid_to
    - object_mapping:
        concept: Person
        expression: transaction_type.lasteditedby
      relationship: person
