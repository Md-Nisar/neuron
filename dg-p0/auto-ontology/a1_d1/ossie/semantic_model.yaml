version: 0.2.0.dev0
name: d1
datasets:
- name: archived_city
  source: d1.application.cities_archive
  description: Archived records of cities with their geographic and population details,
    including validity periods and audit information.
  fields:
  - name: archived_valid_to
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: validto
    datatype: DateTime
    description: Indicates the effective end date and time of the city record in YYYY-MM-DD
      HH:MM:SS format.
  - name: archived_valid_from
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: validfrom
    datatype: DateTime
    description: Indicates the effective start date and time of the city record in
      YYYY-MM-DD HH:MM:SS format.
  - name: archived_location
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: location
    datatype: String
    description: Records the city's geographic coordinates in Well-Known Text point
      format.
  - name: archived_last_edited_by
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: lasteditedby
    datatype: Integer
    description: Identifies the user who last modified the city record.
  - name: archived_city_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: cityid
    datatype: Integer
    description: Uniquely identifies each city in the archive.
  - name: archived_city_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: cityname
    datatype: String
    description: Stores the official name of the city.
  - name: archived_latest_recorded_population
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: latestrecordedpopulation
    datatype: Integer
    description: Holds the most recent population count recorded for the city.
  - name: stateprovinceid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: stateprovinceid
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
- name: archived_color
  source: d1.warehouse.colors_archive
  description: Archived record of a color including its effective date range and audit
    information.
  fields:
  - name: archived_valid_from
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: validfrom
    datatype: DateTime
    description: Timestamp indicating when the color record becomes effective, formatted
      as YYYY-MM-DD HH:MM:SS.
  - name: archived_color_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: colorname
    datatype: String
    description: Name of the color as displayed to users.
  - name: archived_valid_to
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: validto
    datatype: DateTime
    description: Timestamp indicating when the color record ceases to be effective,
      formatted as YYYY-MM-DD HH:MM:SS.
  - name: archived_color_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: colorid
    datatype: Integer
    description: Unique identifier for a color, used to reference the color across
      the system.
  - name: archived_last_edited_by
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: lasteditedby
    datatype: Integer
    description: Identifies the user who last modified the color record.
- name: archived_country
  source: d1.application.countries_archive
  description: Archived version of country reference data including historical validity
    periods.
  fields:
  - name: archived_valid_from
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: validfrom
    datatype: DateTime
    description: Timestamp when this country record version became effective, formatted
      as YYYY-MM-DD HH:MM:SS.
  - name: archived_subregion
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: subregion
    datatype: String
    description: Subregion within the region further specifying the country's location.
  - name: archived_iso_alpha3_code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: isoalpha3code
    datatype: String
    description: Three-letter ISO 3166-1 alpha-3 code uniquely identifying the country.
  - name: archived_latest_recorded_population
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: latestrecordedpopulation
    datatype: Integer
    description: Most recent population count recorded for the country.
  - name: archived_valid_to
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: validto
    datatype: DateTime
    description: Timestamp when this country record version ceased to be effective.
  - name: archived_iso_numeric_code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: isonumericcode
    datatype: Integer
    description: Numeric ISO 3166-1 code assigned to the country for standardized
      identification.
  - name: archived_country_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: countryid
    datatype: Integer
    description: Unique identifier for each archived country record version.
  - name: archived_country_type
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: countrytype
    datatype: String
    description: Political status classification of the country such as UN Member
      State.
  - name: archived_continent
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: continent
    datatype: String
    description: Continent where the country is geographically located.
  - name: archived_formal_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: formalname
    datatype: String
    description: Official legal name of the country as recognized internationally.
  - name: lasteditedby
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: lasteditedby
    datatype: Integer
    description: Identifier of the user who last modified this archived country record.
  - name: archived_country_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: countryname
    datatype: String
    description: Commonly used name identifying the country in business contexts.
  - name: archived_border
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: border
    datatype: String
    description: Geospatial multipolygon defining the country's territorial boundaries.
  - name: archived_region
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: region
    datatype: String
    description: Geographic region grouping the country for analytical purposes.
- name: archived_customer
  source: d1.sales.customers_archive
  description: Archived snapshot of customer master data including contact, address,
    credit, and delivery details.
  fields:
  - name: archived_buying_group_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: buyinggroupid
    datatype: Integer
    description: Identifies the buying group associated with the archived customer.
  - name: archived_alternate_contact_person_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: alternatecontactpersonid
    datatype: Integer
    description: References the alternate contact person linked to the archived customer.
  - name: archived_phone_number
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: phonenumber
    datatype: String
    description: Stores the primary phone number of the archived customer in (XXX)
      XXX-XXXX format.
  - name: postaladdressline2
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: postaladdressline2
    datatype: String
    description: Identifies the city or town for the customer's postal address.
  - name: archived_run_position
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: runposition
    datatype: String
    description: Indicates the sequence position of the archived customer within a
      delivery run.
  - name: archived_delivery_run
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: deliveryrun
    datatype: String
    description: Identifies the delivery run or route assigned to the archived customer.
  - name: archived_postal_city_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: postalcityid
    datatype: Integer
    description: Specifies the postal mailing city for the archived customer using
      a city identifier.
  - name: archived_postal_postal_code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: postalpostalcode
    datatype: String
    description: Identifies the postal code for the customer's postal address.
  - name: deliveryaddressline1
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: deliveryaddressline1
    datatype: String
    description: Identifies the first line of the customer's delivery address, typically
      suite, unit, or shop number.
  - name: archived_fax_number
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: faxnumber
    datatype: String
    description: Stores the fax number of the archived customer in (XXX) XXX-XXXX
      format.
  - name: archived_credit_limit
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: creditlimit
    datatype: Decimal
    description: Defines the maximum credit amount extended to the archived customer.
  - name: archived_delivery_city_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: deliverycityid
    datatype: Integer
    description: Specifies the delivery city for the archived customer using a city
      identifier.
  - name: archived_account_opened_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: accountopeneddate
    datatype: Date
    description: Records the date the archived customer's account was opened in YYYY-MM-DD
      format.
  - name: archived_valid_from
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: validfrom
    datatype: DateTime
    description: Indicates the date and time from which the archived customer record
      is effective, in YYYY-MM-DD HH:MM:SS format.
  - name: archived_valid_to
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: validto
    datatype: DateTime
    description: Indicates the date and time until which the archived customer record
      remains valid, in YYYY-MM-DD HH:MM:SS format.
  - name: archived_delivery_postal_code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: deliverypostalcode
    datatype: String
    description: Identifies the postal code for the customer's delivery address.
  - name: archived_is_statement_sent
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: isstatementsent
    datatype: Boolean
    description: Flags whether a statement has been sent to the archived customer.
  - name: archived_last_edited_by
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: lasteditedby
    datatype: Integer
    description: Identifies the user who last modified the archived customer record.
  - name: archived_is_on_credit_hold
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: isoncredithold
    datatype: Boolean
    description: Flags whether the archived customer is currently on credit hold.
  - name: deliveryaddressline2
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: deliveryaddressline2
    datatype: String
    description: Identifies the street name and number for the customer's delivery
      address.
  - name: archived_standard_discount_percentage
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: standarddiscountpercentage
    datatype: Decimal
    description: Indicates the default discount percentage applied to the archived
      customer's orders.
  - name: archived_payment_days
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: paymentdays
    datatype: Integer
    description: Specifies the number of days allowed for the archived customer to
      pay invoices.
  - name: archived_website_url
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: websiteurl
    datatype: String
    description: Provides the website URL of the archived customer.
  - name: deliverylocation
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: deliverylocation
    datatype: String
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
  - name: billtocustomerid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: billtocustomerid
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
  - name: customerid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: customerid
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
  - name: postaladdressline1
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: postaladdressline1
    datatype: String
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
  - name: customercategoryid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: customercategoryid
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
  - name: primarycontactpersonid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: primarycontactpersonid
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
  - name: customername
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: customername
    datatype: String
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
  - name: deliverymethodid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: deliverymethodid
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
- name: archived_delivery_method
  source: d1.application.deliverymethods_archive
  description: Archived records of delivery methods, including their validity periods
    and audit information.
  fields:
  - name: archived_last_edited_by
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: lasteditedby
    datatype: Integer
    description: lasteditedby identifies the user who last modified the archived delivery
      method.
  - name: archived_valid_to
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: validto
    datatype: DateTime
    description: validto records the date and time when the delivery method ceases
      to be effective, formatted as YYYY-MM-DD HH:MM:SS.
  - name: archived_valid_from
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: validfrom
    datatype: DateTime
    description: validfrom records the date and time when the delivery method becomes
      effective, formatted as YYYY-MM-DD HH:MM:SS.
  - name: archived_delivery_method_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: deliverymethodname
    datatype: String
    description: deliverymethodname provides the descriptive name of the delivery
      method type.
  - name: archived_delivery_method_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: deliverymethodid
    datatype: Integer
    description: deliverymethodid uniquely identifies each archived delivery method
      record.
- name: archived_package_type
  source: d1.warehouse.packagetypes_archive
  fields:
  - name: archived_package_type_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: packagetypename
    datatype: String
    description: Descriptive name identifying the type of package in the archive.
  - name: archived_last_edited_by
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: lasteditedby
    datatype: Integer
    description: Identifies the user who last modified the archived package type record.
  - name: archived_valid_to
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: validto
    datatype: DateTime
    description: Timestamp when the archived package type ceased to be effective,
      without time zone.
  - name: archived_package_type_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: packagetypeid
    datatype: Integer
    description: Unique numeric identifier for each archived package type record.
  - name: archived_valid_from
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: validfrom
    datatype: DateTime
    description: Timestamp when the archived package type became effective, without
      time zone.
- name: archived_payment_method
  source: d1.application.paymentmethods_archive
  description: A payment method record preserved in the archive with its effective
    date range.
  fields:
  - name: archived_valid_from
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: validfrom
    datatype: DateTime
    description: Records the timestamp when the archived payment method becomes effective,
      formatted as YYYY-MM-DD HH:MM:SS.
  - name: lasteditedby
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: lasteditedby
    datatype: Integer
    description: Identifies the user who last modified the archived payment method
      record.
  - name: archived_payment_method_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: paymentmethodname
    datatype: String
    description: Provides the descriptive name of the archived payment method, such
      as Credit Card.
  - name: archived_valid_to
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: validto
    datatype: DateTime
    description: Records the timestamp when the archived payment method ceases to
      be effective, formatted as YYYY-MM-DD HH:MM:SS.
  - name: archived_payment_method_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: paymentmethodid
    datatype: Integer
    description: Identifies a specific archived payment method record using a unique
      numeric key.
- name: archived_person
  source: d1.application.people_archive
  description: An archived record of a person (user or employee) including identity,
    authentication, contact, role, and temporal validity details.
  fields:
  - name: archived_valid_from
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: validfrom
    datatype: DateTime
    description: Indicates the date and time when this archived person record became
      effective, in YYYY-MM-DD HH:MM:SS format.
  - name: archived_full_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: fullname
    datatype: String
    description: The person's full legal or formal name as recorded in the archive.
  - name: archived_custom_fields
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: customfields
    datatype: String
    description: Stores structured employee attributes including hire date, job title,
      sales territory, commission rate, and languages in JSON format.
  - name: archived_is_permitted_to_logon
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ispermittedtologon
    datatype: Boolean
    description: Indicates whether the archived person's account is authorized to
      authenticate and access the system.
  - name: archived_search_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: searchname
    datatype: String
    description: A concatenated search field combining preferred and full name for
      optimized lookup.
  - name: archived_hashed_password
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: hashedpassword
    datatype: Opaque
    description: The cryptographically hashed password stored for secure authentication
      of the archived person.
  - name: archived_user_preferences
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: userpreferences
    datatype: String
    description: Stores the archived person's interface and regional settings in JSON
      format.
  - name: archived_email_address
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: emailaddress
    datatype: String
    description: The primary email address used for communication and notifications
      with the archived person.
  - name: archived_preferred_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: preferredname
    datatype: String
    description: The informal or chosen name the person prefers to be called.
  - name: archived_fax_number
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: faxnumber
    datatype: String
    description: The fax number for document transmission associated with the archived
      person, formatted as (XXX) XXX-XXXX.
  - name: archived_is_external_logon_provider
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: isexternallogonprovider
    datatype: Boolean
    description: Flags whether authentication for the archived person is delegated
      to an external identity provider.
  - name: archived_is_system_user
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: issystemuser
    datatype: Boolean
    description: Indicates whether the archived account represents a system-level
      user rather than a human.
  - name: archived_logon_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: logonname
    datatype: String
    description: The unique login identifier, typically an email address, or 'NO LOGON'
      when access is disabled.
  - name: archived_photo
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: photo
    datatype: Opaque
    description: Binary storage of the archived person's profile photograph.
  - name: archived_is_employee
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: isemployee
    datatype: Boolean
    description: Specifies whether the archived person is an internal employee of
      the organization.
  - name: archived_phone_number
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: phonenumber
    datatype: String
    description: The primary contact phone number for the archived person, formatted
      as (XXX) XXX-XXXX.
  - name: archived_valid_to
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: validto
    datatype: DateTime
    description: Indicates the date and time when this archived person record ceased
      to be effective, in YYYY-MM-DD HH:MM:SS format.
  - name: lasteditedby
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: lasteditedby
    datatype: Integer
    description: Identifies the user who last modified this archived person record.
  - name: archived_is_salesperson
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: issalesperson
    datatype: Boolean
    description: Denotes whether the archived person holds a sales role with associated
      permissions.
  - name: archived_other_languages
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: otherlanguages
    datatype: String
    description: Lists additional languages spoken by the employee as an array of
      language names.
  - name: personid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: personid
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
