    description: The full official name of the state or province.
  - name: lasteditedby
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: lasteditedby
    datatype: Integer
    description: Identifies the user who last modified the state or province record.
  - name: stateprovinceid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: stateprovinceid
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
