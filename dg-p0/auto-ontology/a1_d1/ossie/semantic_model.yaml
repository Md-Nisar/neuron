      dialects:
      - dialect: ANSI_SQL
        expression: iscompressed
    datatype: Boolean
    description: Indicates whether the sensor data payload is stored in a compressed
      format.
  - name: recorded_when
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: recordedwhen
