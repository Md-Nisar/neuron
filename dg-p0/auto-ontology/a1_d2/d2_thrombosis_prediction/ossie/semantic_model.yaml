version: 0.2.0.dev0
name: d2_thrombosis_prediction
datasets:
- name: clinical_examination
  source: d2_thrombosis_prediction.public.examination
  fields:
  - name: anticardiolipin_ig_m_level
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: aCL IgM
    datatype: Float
    description: aCL IgM measures the quantitative level of anticardiolipin IgM antibody
      in the patient's blood sample.
  - name: ana_titer
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ana
    datatype: Integer
    description: ana captures the antinuclear antibody titer as an integer dilution
      factor.
  - name: ana_pattern
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ANA Pattern
    datatype: String
    description: ANA Pattern records the fluorescence pattern codes observed in the
      antinuclear antibody test as a comma-separated string.
  - name: thrombosis_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: thrombosis
    datatype: Integer
    description: thrombosis records the count or severity score of thrombotic events
      experienced by the patient as an integer.
  - name: kaolin_clotting_time_result
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: kct
    datatype: String
    description: kct indicates the presence (+) or absence (-) of lupus anticoagulant
      activity via the kaolin clotting time test.
  - name: rvvt
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: rvvt
    datatype: String
    description: rvvt indicates the presence (+) or absence (-) of lupus anticoagulant
      activity via the Russell's viper venom time test.
  - name: anticardiolipin_ig_g_level
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: aCL IgG
    datatype: Float
    description: aCL IgG measures the quantitative level of anticardiolipin IgG antibody
      in the patient's blood sample.
  - name: lupus_anticoagulant_result
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: lac
    datatype: String
    description: lac indicates the presence (+) or absence (-) of lupus anticoagulant
      based on the lupus anticoagulant test.
  - name: symptoms
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: symptoms
    datatype: String
    description: symptoms lists the clinical symptoms or disease manifestations reported
      for the patient as a comma-separated list.
  - name: anticardiolipin_ig_a_level
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: aCL IgA
    datatype: Integer
    description: aCL IgA records the quantitative level of anticardiolipin IgA antibody
      in the patient's blood as an integer.
  - name: diagnosis
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: diagnosis
    datatype: String
    description: diagnosis stores the confirmed clinical diagnosis assigned to the
      patient, such as systemic lupus erythematosus or antiphospholipid syndrome.
  - name: examination_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: Examination Date
    datatype: Date
    description: Examination Date records the calendar date when the clinical examination
      or laboratory test was performed, formatted as YYYY-MM-DD.
  - name: id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
- name: laboratory_test
  source: d2_thrombosis_prediction.public.laboratory
  description: A comprehensive laboratory test panel containing liver function, kidney
    function, lipid profile, complete blood count, coagulation studies, immunoglobulins,
    inflammatory markers, complement levels, and autoantibody results.
  fields:
  - name: rnp
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: rnp
    datatype: String
    description: Flags the presence (1) or absence (0) of anti‑RNP antibodies using
      a text indicator.
  - name: triglycerides
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: tg
    datatype: Integer
    description: Captures triglyceride concentration in blood in milligrams per deciliter.
  - name: rheumatoid_factor
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: rf
    datatype: String
    description: Stores the rheumatoid factor level as a text string that may include
      inequality signs.
  - name: hematocrit
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: hct
    datatype: Float
    description: The patient's hematocrit as a percentage of blood volume, indicating
      red blood cell proportion.
  - name: ig_m
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: igm
    datatype: Integer
    description: The patient's immunoglobulin M concentration in milligrams per deciliter,
      showing early immune response magnitude.
  - name: aptt
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: aptt
    datatype: Integer
    description: The patient's activated partial thromboplastin time in seconds, measuring
      clotting pathway efficiency.
  - name: glucose
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: glu
    datatype: Integer
    description: Records blood glucose concentration in milligrams per deciliter.
  - name: complement_c3
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: c3
    datatype: Integer
    description: Holds the complement component 3 concentration as a whole‑number
      integer value.
  - name: centromea
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: centromea
    datatype: String
    description: Shows anti‑centromere antibody result as text indicating negative
      or absent.
  - name: fibrinogen
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: fg
    datatype: Float
    description: The patient's fibrinogen level in milligrams per deciliter, indicating
      clotting factor availability.
  - name: total_bilirubin
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: T-BIL
    datatype: Float
    description: Measures total bilirubin concentration in blood in milligrams per
      deciliter.
  - name: crp
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: crp
    datatype: String
    description: Records the C‑reactive protein result as qualitative or semi‑quantitative
      text such as negative, positive, or graded levels.
  - name: dna
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: dna
    datatype: String
    description: Stores the anti‑double‑stranded DNA antibody level as a text numeric
      value.
  - name: total_protein
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: tp
    datatype: Float
    description: Records total protein concentration in blood in grams per deciliter.
  - name: complement_c4
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: c4
    datatype: Integer
    description: Holds the complement component 4 concentration as a whole‑number
      integer value.
  - name: white_blood_cell_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: wbc
    datatype: Float
    description: The patient's white blood cell count in billions per liter, indicating
      immune system activity.
  - name: albumin
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: alb
    datatype: Float
    description: Captures albumin concentration in blood in grams per deciliter.
  - name: ig_a
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: iga
    datatype: Integer
    description: The patient's immunoglobulin A concentration in milligrams per deciliter,
      indicating mucosal immunity level.
  - name: alt_level
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: gpt
    datatype: Integer
    description: Records the alanine aminotransferase (ALT) liver enzyme level in
      units per liter.
  - name: creatinine
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: cre
    datatype: Float
    description: Captures serum creatinine concentration in milligrams per deciliter.
  - name: protein_c_activity
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: pic
    datatype: Integer
    description: The patient's protein C activity or concentration measurement, assessing
      anticoagulation regulation.
  - name: sm
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: sm
    datatype: String
    description: Flags the presence (1) or absence (0) of anti‑Sm antibodies using
      a text indicator.
  - name: urine_protein
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: U-PRO
    datatype: String
    description: The qualitative urine protein dipstick result using categories 0,
      -, TR, 1, 2 to indicate proteinuria severity.
  - name: dna_ii
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: DNA-II
    datatype: Integer
    description: Holds a second anti‑DNA antibody measurement as a whole‑number integer.
  - name: hemoglobin
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: hgb
    datatype: Float
    description: The patient's hemoglobin level in grams per deciliter, showing blood's
      oxygen transport ability.
  - name: test_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: date
    datatype: Date
    description: Records the calendar date when the laboratory test panel was conducted,
      formatted as YYYY-MM-DD.
  - name: ssb
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ssb
    datatype: String
    description: Indicates anti‑SSB antibody status as a text flag, currently observed
      only as negative (0).
  - name: tat2
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: tat2
    datatype: Integer
    description: A secondary thrombin-antithrombin complex measurement in micrograms
      per liter, providing additional coagulation insight.
  - name: sc170
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: sc170
    datatype: String
    description: Records the anti‑Scl‑70 antibody result as text that can be numeric
      or qualitative such as negative.
  - name: platelet_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: plt
    datatype: Integer
    description: The patient's platelet count in billions per liter, assessing clotting
      function.
  - name: ast_level
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: got
    datatype: Integer
    description: Captures the aspartate aminotransferase (AST) liver enzyme level
      in units per liter.
  - name: ssa
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ssa
    datatype: String
    description: Indicates anti‑SSA antibody status as a text flag, currently observed
      only as negative (0).
  - name: prothrombin_time
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: pt
    datatype: Float
    description: The patient's prothrombin time in seconds, evaluating blood clotting
      speed.
  - name: tat
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: tat
    datatype: Integer
    description: The patient's thrombin-antithrombin complex level in micrograms per
      liter, reflecting thrombin generation.
  - name: rheumatoid_arthritis_factor
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ra
    datatype: String
    description: Captures the rheumatoid arthritis factor outcome as qualitative text
      indicators like positive, negative, or graded symbols.
  - name: alp_level
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: alp
    datatype: Integer
    description: Tracks the alkaline phosphatase (ALP) enzyme level in units per liter
      related to liver and bone metabolism.
  - name: red_blood_cell_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: rbc
    datatype: Float
    description: The patient's red blood cell count in trillions per liter, reflecting
      oxygen-carrying capacity.
  - name: ig_g
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: igg
    datatype: Integer
    description: The patient's immunoglobulin G concentration in milligrams per deciliter,
      reflecting humoral immunity status.
  - name: uric_acid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ua
    datatype: Float
    description: Measures uric acid concentration in blood in milligrams per deciliter.
  - name: ldh_level
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ldh
    datatype: Integer
    description: Measures the lactate dehydrogenase (LDH) enzyme level in units per
      liter as an indicator of tissue damage.
  - name: cpk_level
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: cpk
    datatype: Integer
    description: Measures creatine phosphokinase (CPK) enzyme level in units per liter
      as an indicator of muscle damage.
  - name: total_cholesterol
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: T-CHO
    datatype: Integer
    description: Records total cholesterol concentration in blood in milligrams per
      deciliter.
  - name: bun_level
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: un
    datatype: Integer
    description: Records blood urea nitrogen (BUN) level in milligrams per deciliter.
  - name: id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
- name: patient
  source: d2_thrombosis_prediction.public.patient
  description: Core patient demographic and clinical information.
  unique_keys:
  - - patient_id
  fields:
  - name: first_encounter_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: First Date
    datatype: Date
    description: Date of the patient's first recorded clinical encounter or diagnosis
      in YYYY-MM-DD format.
  - name: date_of_birth
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: birthday
    datatype: Date
    description: Patient's date of birth in YYYY-MM-DD format, used for age calculation
      and demographic analysis.
  - name: description_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: description
    datatype: Date
    description: Date of a clinical note or documentation event in YYYY-MM-DD format,
      despite the field name 'description'.
  - name: diagnosis
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: diagnosis
    datatype: String
    description: Primary clinical diagnosis recorded as standardized abbreviations
      such as SLE, RA, or BEHCET.
  - name: patient_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    datatype: Integer
    description: Unique identifier for the patient, linking clinical records to examinations
      and laboratory results.
  - name: biological_sex
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: sex
    datatype: String
    description: Biological sex of the patient, recorded as F for female, M for male,
      or blank when unknown.
  - name: admission_status
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: admission
    datatype: String
    description: Admission status indicator using symbolic codes like '-', '+', or
      '+(' for classification, with blank for unknown.
