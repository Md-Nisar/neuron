version: 0.2.0.dev0
name: d2_formula_1
datasets:
- name: constructor
  source: d2_formula_1.public.constructors
  description: A Formula 1 constructor (team) that designs and builds racing cars.
  unique_keys:
  - - constructor_id
  fields:
  - name: nationality
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: nationality
    datatype: String
    description: Country of origin associated with the constructor, such as British,
      Italian, or German.
  - name: wikipedia_url
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: url
    datatype: String
    description: Hyperlink to the constructor's Wikipedia page providing additional
      reference information.
  - name: constructor_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: constructorid
    datatype: Integer
    description: Unique numeric identifier for each Formula 1 constructor, used to
      link constructor performance and standings across race data.
  - name: constructor_reference
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: constructorref
    datatype: String
    description: Lowercase, underscore-separated system code uniquely identifying
      each constructor for internal reference.
  - name: name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: name
    datatype: String
    description: Official display name of the Formula 1 constructor as recognized
      in championship records.
- name: constructor_result
  source: d2_formula_1.public.constructorresults
  fields:
  - name: constructor_result_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: constructorresultsid
    datatype: Integer
    description: Uniquely identifies each constructor race result record with a numeric
      identifier.
  - name: points
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: points
    datatype: Float
    description: Records the championship points awarded to a constructor for a specific
      race as a decimal value.
  - name: status
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: status
    datatype: String
    description: Indicates the constructor's race outcome using a single-character
      status code.
  - name: constructorid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: constructorid
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
  - name: raceid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: raceid
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
- name: constructor_standing
  source: d2_formula_1.public.constructorstandings
  description: Represents a constructor's final standing in a championship season.
  fields:
  - name: position
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: position
    datatype: Integer
    description: Numerical rank of the constructor in the final championship standings.
  - name: wins
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: wins
    datatype: Integer
    description: Number of race victories achieved by the constructor during the championship
      season.
  - name: constructor_standing_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: constructorstandingsid
    datatype: Integer
    description: Unique identifier for each constructor's championship standing record.
  - name: total_points
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: points
    datatype: Float
    description: Total championship points earned by the constructor during the season,
      stored as a real number.
  - name: position_text
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: positiontext
    datatype: String
    description: Textual representation of the constructor's championship position
      for display purposes.
  - name: constructorid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: constructorid
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
  - name: raceid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: raceid
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
- name: driver
  source: d2_formula_1.public.drivers
  description: A racing driver with their personal details, racing identifiers, and
    biographical information.
  unique_keys:
  - - driver_id
  fields:
  - name: nationality
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: nationality
    datatype: String
    description: nationality indicates the country the driver represents or holds
      citizenship for.
  - name: date_of_birth
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: dob
    datatype: Date
    description: dob captures the driver's date of birth in YYYY-MM-DD format.
  - name: driver_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: driverid
    datatype: Integer
    description: driverid identifies the driver uniquely across standings, lap times,
      pit stops, qualifying, and results.
  - name: racing_number
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: number
    datatype: Integer
    description: number stores the driver's permanent racing number used in competition.
  - name: last_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: surname
    datatype: String
    description: surname records the driver's family name.
  - name: driver_reference
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: driverref
    datatype: String
    description: driverref provides a lowercase system-friendly identifier for the
      driver.
  - name: first_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: forename
    datatype: String
    description: forename records the driver's given first name.
  - name: driver_code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: code
    datatype: String
    description: code holds the three-letter abbreviation used for the driver in official
      timing and results.
  - name: wikipedia_url
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: url
    datatype: String
    description: url provides a link to the driver's Wikipedia page for further biographical
      details.
- name: driver_standing
  source: d2_formula_1.public.driverstandings
  description: Represents a driver's championship standing including points, position,
    and wins.
  fields:
  - name: position_text
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: positiontext
    datatype: String
    description: Provides the driver's championship position as text for display.
  - name: position
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: position
    datatype: Integer
    description: Indicates the driver's numerical rank in the championship standings.
  - name: driver_standing_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: driverstandingsid
    datatype: Integer
    description: Uniquely identifies each driver's championship standing record.
  - name: total_points
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: points
    datatype: Float
    description: Records the total championship points accumulated by the driver.
  - name: wins
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: wins
    datatype: Integer
    description: Counts the number of race victories the driver achieved this season.
  - name: driverid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: driverid
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
  - name: raceid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: raceid
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
- name: lap_time
  source: d2_formula_1.public.laptimes
  fields:
  - name: lap_number
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: lap
    datatype: Integer
    description: Identifies the sequential lap number completed by a driver during
      a race session.
  - name: milliseconds
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: milliseconds
    datatype: Integer
    description: Records the exact lap duration in total milliseconds for precise
      timing analysis.
  - name: formatted_time
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: time
    datatype: String
    description: Displays the human-readable lap time in minutes:seconds.milliseconds
      format for reporting.
  - name: position
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: position
    datatype: Integer
    description: Shows the driver's race position after completing each lap.
  - name: raceid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: raceid
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
  - name: driverid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: driverid
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
- name: pit_stop
  source: d2_formula_1.public.pitstops
  fields:
  - name: stop_number
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: stop
    datatype: Integer
    description: Identifies the sequential number of a pit stop within a race session.
  - name: duration
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: duration
    datatype: String
    description: Captures the pit stop duration in seconds as a text value.
  - name: milliseconds
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: milliseconds
    datatype: Integer
    description: Provides the pit stop duration in milliseconds as an integer.
  - name: clock_time
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: time
    datatype: String
    description: Records the clock time of the pit stop in HH:MM:SS format.
  - name: lap_number
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: lap
    datatype: Integer
    description: Indicates the lap number on which the pit stop occurred.
  - name: driverid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: driverid
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
  - name: raceid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: raceid
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
- name: qualifying_result
  source: d2_formula_1.public.qualifying
  description: Represents a driver's qualifying session result including car number,
    final position, and segment lap times.
  fields:
  - name: q3_lap_time
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: q3
    datatype: String
    description: Records the driver's lap time in the third qualifying segment (Q3)
      in minutes:seconds.milliseconds format.
  - name: car_number
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: number
    datatype: Integer
    description: Indicates the car number assigned to the driver for that qualifying
      session.
  - name: q1_lap_time
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: q1
    datatype: String
    description: Records the driver's lap time in the first qualifying segment (Q1)
      in minutes:seconds.milliseconds format.
  - name: qualifying_position
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: position
    datatype: Integer
    description: Shows the final grid position the driver achieved in the qualifying
      session.
  - name: q2_lap_time
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: q2
    datatype: String
    description: Records the driver's lap time in the second qualifying segment (Q2)
      in minutes:seconds.milliseconds format.
  - name: qualifying_result_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: qualifyid
    datatype: Integer
    description: Uniquely identifies each qualifying session result record.
  - name: constructorid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: constructorid
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
  - name: driverid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: driverid
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
  - name: raceid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: raceid
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
- name: race
  source: d2_formula_1.public.races
  description: A Grand Prix racing event in a Formula 1 season.
  unique_keys:
  - - race_id
  fields:
  - name: race_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: raceid
    datatype: Integer
    description: Unique identifier for each Grand Prix race, used to link results,
      standings, and session data.
  - name: race_time
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: time
    datatype: String
    description: Scheduled start time of the race in HH:MM:SS format.
  - name: round_number
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: round
    datatype: Integer
    description: Sequential round number indicating the race's position within a Formula
      1 season.
  - name: race_url
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: url
    datatype: String
    description: Web link to the race's Wikipedia page for reference.
  - name: race_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: name
    datatype: String
    description: Official name of the Grand Prix event, such as 'British Grand Prix'.
  - name: race_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: date
    datatype: Date
    description: Calendar date on which the race takes place in YYYY-MM-DD format.
  - name: year
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: year
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
  - name: circuitid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: circuitid
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
- name: race_result
  source: d2_formula_1.public.results
  description: Represents a single driver's result in a race, including starting position,
    finishing position, laps completed, points earned, and fastest lap details.
  fields:
  - name: grid_position
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: grid
    datatype: Integer
    description: Indicates the driver's starting grid position for the race.
  - name: fastest_lap_number
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: fastestlap
    datatype: Integer
    description: Indicates the lap number where the driver set their fastest lap.
  - name: race_time
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: time
    datatype: String
    description: Captures the winner's total race time or the time gap behind the
      winner.
  - name: car_number
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: number
    datatype: Integer
    description: Identifies the car number assigned to the driver for the race.
  - name: fastest_lap_speed
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: fastestlapspeed
    datatype: String
    description: Provides the average speed in km/h during the driver's fastest lap.
  - name: result_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: resultid
    datatype: Integer
    description: Uniquely identifies each race result record.
  - name: finishing_position
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: position
    datatype: Integer
    description: Shows the driver's numeric finishing position in the race.
  - name: position_order
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: positionorder
    datatype: Integer
    description: Defines the sequential ranking order used to sort race results.
  - name: position_text
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: positiontext
    datatype: String
    description: Provides the finishing position as text, using 'R' for retired drivers.
  - name: fastest_lap_time
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: fastestlaptime
    datatype: String
    description: Records the driver's fastest lap time in minutes:seconds.milliseconds
      format.
  - name: race_time_milliseconds
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: milliseconds
    datatype: Integer
    description: Stores the exact race time in milliseconds for precise measurement.
  - name: fastest_lap_rank
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: rank
    datatype: Integer
    description: Ranks the driver's fastest lap time against all other drivers' fastest
      laps.
  - name: championship_points
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: points
    datatype: Float
    description: Records the championship points earned by the driver in this race.
  - name: laps_completed
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: laps
    datatype: Integer
    description: Counts the total laps completed by the driver during the race.
  - name: raceid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: raceid
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
  - name: statusid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: statusid
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
  - name: driverid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: driverid
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
  - name: constructorid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: constructorid
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
- name: race_session_status
  source: d2_formula_1.public.status
  description: A unique status type for a race or session, such as Finished, Disqualified,
    or a mechanical failure reason.
  unique_keys:
  - - status_id
  fields:
  - name: status_description
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: status
    datatype: String
    description: The descriptive label for a race or session result, such as Finished,
      Disqualified, Accident, Collision, or Engine failure.
  - name: status_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: statusid
    datatype: Integer
    description: A unique numeric code that identifies each race or session outcome
      type, such as Finished or Disqualified.
- name: racing_circuit
  source: d2_formula_1.public.circuits
  unique_keys:
  - - circuit_id
  fields:
  - name: longitude
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: lng
    datatype: Float
    description: Records the circuit's geographic longitude in decimal degrees.
  - name: name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: name
    datatype: String
    description: States the official full name of the racing circuit as recognized
      by Formula 1.
  - name: circuit_reference
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: circuitref
    datatype: String
    description: Provides a standardized short code for identifying the circuit in
      URLs and internal systems.
  - name: altitude
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: alt
    datatype: Integer
    description: Measures the circuit's elevation above sea level in meters.
  - name: circuit_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: circuitid
    datatype: Integer
    description: Uniquely identifies each racing circuit and links to associated races.
  - name: location
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: location
    datatype: String
    description: Indicates the city or geographic region where the racing circuit
      is physically located.
  - name: country
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: country
    datatype: String
    description: Specifies the sovereign country in which the racing circuit is located.
  - name: url
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: url
    datatype: String
    description: Provides a hyperlink to the circuit's Wikipedia page for reference.
  - name: latitude
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: lat
    datatype: Float
    description: Records the circuit's geographic latitude in decimal degrees.
- name: season
  source: d2_formula_1.public.seasons
  unique_keys:
  - - year
  fields:
  - name: wikipedia_url
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: url
    datatype: String
    description: Provides the Wikipedia web address for the Formula One season.
  - name: year
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: year
    datatype: Integer
    description: Identifies the four-digit calendar year of the Formula One season,
      linking races to their respective season.
