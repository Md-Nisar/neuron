    bridge_table:
    - id: f57dce33-64c2-4f59-9906-fb8d8c0ba047
      name: Connected Atoms Bonds
      description: Bridge table connecting atoms and bonds, with two atom references
        (atom_id and atom_id2) and one bond reference.
      sql: SELECT c.atom_id, c.atom_id2, c.bond_id, a1.atom_id AS atom_id_1, a2.atom_id
        AS atom_id_2, b.bond_id FROM public.connected c JOIN public.atom a1 ON c.atom_id
        = a1.atom_id JOIN public.atom a2 ON c.atom_id2 = a2.atom_id JOIN public.bond
        b ON c.bond_id = b.bond_id
      sql_column_is:
