version: 0.2.0.dev0
name: d2_toxicology
datasets:
- name: atom
  source: d2_toxicology.public.atom
  fields:
  - name: atom_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: atom_id
    datatype: String
    description: Unique identifier for an atom in a molecular structure, formatted
      as a prefix followed by an underscore and sequential number, used to link atoms
      in connectivity records.
  - name: element
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: element
    datatype: String
    description: Chemical element symbol denoting the atom type, using standard lowercase
      abbreviations like h, c, cl, o, n.
  - name: connected_atoms_bonds
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: c.atom_id
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"sql_attribute","id":"f57dce33-64c2-4f59-9906-fb8d8c0ba047","ossie_expression":"c.atom_id","sql":"SELECT
        c.atom_id, c.atom_id2, c.bond_id, a1.atom_id AS atom_id_1, a2.atom_id AS atom_id_2,
        b.bond_id FROM public.connected c JOIN public.atom a1 ON c.atom_id = a1.atom_id
        JOIN public.atom a2 ON c.atom_id2 = a2.atom_id JOIN public.bond b ON c.bond_id
        = b.bond_id","sql_column_is":["d237fd79-d670-4d50-872a-62309ab7edc2","c7a2e5e8-7a08-41df-95a5-3cecb85d228e","d77ae28b-78a9-48d8-a65b-2d0e899452ea","729c1e34-41c3-4c94-bd8c-ca58ea3e62e0","8d123b78-4db3-4ed0-868d-4992c5bda12d"],"sql_source":"bridge_table","term_id":"98a67c01-837c-4163-a8ab-3df7de60cb35"}'
    description: Bridge table connecting atoms and bonds, with two atom references
      (atom_id and atom_id2) and one bond reference.
  - name: molecule_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: molecule_id
    datatype: String
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
- name: bond
  source: d2_toxicology.public.bond
  fields:
  - name: bond_type
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: bond_type
    datatype: String
    description: Categorical code representing the bond type using symbolic characters
      such as '-', '=', or '#'.
  - name: bond_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: bond_id
    datatype: String
    description: Unique identifier for a bond instrument, formatted as a prefix and
      numeric components separated by underscores, used to link related bonds.
  - name: molecule_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: molecule_id
    datatype: String
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
- name: molecule
  source: d2_toxicology.public.molecule
  unique_keys:
  - - molecule_id
  fields:
  - name: experimental_outcome
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: label
    datatype: String
    description: Binary indicator of experimental outcome for a molecule, with '+'
      for positive and '-' for negative results.
  - name: molecule_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: molecule_id
    datatype: String
    description: Unique identifier for a molecular compound in a screening library,
      formatted as 'TR' followed by a numeric code, linking to its constituent atoms
      and bonds.
