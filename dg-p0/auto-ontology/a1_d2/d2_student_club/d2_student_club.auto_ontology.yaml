    - id: 40278316-2cc3-477f-80bc-f5659ae64723
      name: Member Event Attendance
      description: Links members to events they attended via the attendance bridge
        table.
      sql: SELECT m.member_id, e.event_id FROM public.attendance a JOIN public.member
        m ON a.link_to_member = m.member_id JOIN public.event e ON a.link_to_event
        = e.event_id
