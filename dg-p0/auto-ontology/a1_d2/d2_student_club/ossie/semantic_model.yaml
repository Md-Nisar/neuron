  fields:
  - name: city
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: city
    datatype: String
    description: Names the city associated with the ZIP code.
  - name: zip_code_type
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: type
    datatype: String
    description: Classifies the ZIP code by delivery type such as Standard, PO Box,
      or Unique.
  - name: county
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: county
    datatype: String
    description: Names the county associated with the ZIP code.
  - name: zip_code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: zip_code
    datatype: Integer
    description: Numeric ZIP code without leading zeros that identifies a geographic
      location and links to member records.
  - name: state_abbreviation
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: short_state
    datatype: String
    description: Gives the two-letter state or territory abbreviation for the ZIP
      code.
  - name: state
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: state
    datatype: String
    description: Provides the full state or territory name for the ZIP code.
