version: 0.2.0.dev0
name: d2_student_club
datasets:
- name: academic_major
  source: d2_student_club.public.major
  unique_keys:
  - - major_id
  fields:
  - name: major_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: major_id
    datatype: String
    description: Unique identifier for an academic major program, formatted as text,
      used to link members to their major.
  - name: major_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: major_name
    datatype: String
    description: Official name of an academic major program offered by the institution,
      stored as text.
  - name: college
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: college
    datatype: String
    description: College or school within the university that houses the department
      offering the major, stored as text.
  - name: department
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: department
    datatype: String
    description: Academic department responsible for administering the major program,
      recorded as text.
- name: budget
  source: d2_student_club.public.budget
  description: A budget record tracking allocated, spent, and remaining amounts by
    category with associated event status.
  unique_keys:
  - - budget_id
  fields:
  - name: budget_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: budget_id
    datatype: String
    description: Identifies a specific budget record and links to related expenses.
  - name: spent_amount
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: spent
    datatype: Float
    description: Shows the total money already spent from this budget.
  - name: category
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: category
    datatype: String
    description: Classifies the type of expense the budget covers, e.g., Food or Advertising.
  - name: event_status
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: event_status
    datatype: String
    description: Reflects the current stage of the event linked to this budget, such
      as Open or Closed.
  - name: allocated_amount
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: amount
    datatype: Integer
    description: Specifies the total funds allocated to this budget category.
  - name: remaining_amount
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: remaining
    datatype: Float
    description: Indicates the amount of budget still available for future spending.
  - name: link_to_event
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: link_to_event
    datatype: String
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
- name: event
  source: d2_student_club.public.event
  description: An event record with details such as name, date, type, location, and
    status.
  unique_keys:
  - - event_id
  fields:
  - name: notes
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: notes
    datatype: String
    description: Additional details, instructions, or attendance requirements associated
      with the event.
  - name: status
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: status
    datatype: String
    description: Current state of the event, such as Open, Closed, or Planning.
  - name: location
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: location
    datatype: String
    description: Venue name or physical address where the event occurs, such as 'MU
      215' or 'Campus Soccer/Lacrosse stadium'.
  - name: event_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: event_date
    datatype: String
    description: Scheduled date and time of the event in ISO 8601 format (YYYY-MM-DDTHH:MM:SS).
  - name: event_type
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: type
    datatype: String
    description: Category classifying the event, such as Meeting, Guest Speaker, Game,
      Social, or Community Service.
  - name: event_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: event_id
    datatype: String
    description: Unique identifier for the event, referenced by attendance and budget
      records to link related information.
  - name: event_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: event_name
    datatype: String
    description: Descriptive title identifying the event, such as 'Laugh Out Loud'
      or 'Football game'.
- name: expense
  source: d2_student_club.public.expense
  description: A record of an expense incurred.
  fields:
  - name: approved
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: approved
    datatype: String
    description: Indicates whether the expense has been approved, stored as text boolean.
  - name: expense_description
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: expense_description
    datatype: String
    description: Describes the item or service purchased for the expense.
  - name: expense_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: expense_id
    datatype: String
    description: Identifies a specific expense record.
  - name: cost
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: cost
    datatype: Float
    description: Specifies the monetary amount of the expense in currency units.
  - name: expense_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: expense_date
    datatype: String
    description: Records the date the expense was incurred in YYYY-MM-DD format.
  - name: link_to_member
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: link_to_member
    datatype: String
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
  - name: link_to_budget
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: link_to_budget
    datatype: String
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
- name: income_record
  source: d2_student_club.public.income
  description: A record of income received, including its source, amount, date, and
    any additional notes.
  fields:
  - name: date_received
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: date_received
    datatype: String
    description: Records the date the income was received in YYYY-MM-DD format.
  - name: notes
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: notes
    datatype: String
    description: Captures additional descriptive details about the income entry, such
      as purpose or context.
  - name: income_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: income_id
    datatype: String
    description: Uniquely identifies each income record using a text-based code.
  - name: source
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: source
    datatype: String
    description: Categorizes the origin of the income, such as Dues or Sponsorship.
  - name: amount
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: amount
    datatype: Integer
    description: Specifies the monetary amount of the income as a whole number.
  - name: link_to_member
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: link_to_member
    datatype: String
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
- name: member
  source: d2_student_club.public.member
  description: Represents a member in the system with their personal and contact details.
  unique_keys:
  - - member_id
  fields:
  - name: member_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: member_id
    datatype: String
    description: Unique record ID (prefixed 'rec') identifying the member and linking
      to attendance, expenses, and income.
  - name: last_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: last_name
    datatype: String
    description: Member's family name used for identification and communication.
  - name: email
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: email
    datatype: String
    description: Institutional email address in firstname.lastname@lpu.edu format
      for official communication.
  - name: t_shirt_size
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: t_shirt_size
    datatype: String
    description: Preferred apparel size (Small, Medium, Large, X-Large) for merchandise
      distribution.
  - name: phone
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: phone
    datatype: String
    description: Contact phone number in varying formats (e.g., (651) 928-4507 or
      403-555-1310) for member outreach.
  - name: first_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: first_name
    datatype: String
    description: Member's given name used for identification and communication.
  - name: position
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: position
    datatype: String
    description: Current organizational role such as Member, President, Vice President,
      Treasurer, or Inactive status.
  - name: member_event_attendance
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: m.member_id
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"sql_attribute","id":"40278316-2cc3-477f-80bc-f5659ae64723","ossie_expression":"m.member_id","sql":"SELECT
        m.member_id, e.event_id FROM public.attendance a JOIN public.member m ON a.link_to_member
        = m.member_id JOIN public.event e ON a.link_to_event = e.event_id","sql_column_is":["da0aae2a-8cd9-4de8-94cb-528207ccd93f","a43a928f-cf65-43a0-851d-d4d16b319f10","7b9fad5d-ec95-483c-a156-5b21e3027fc0","2445380d-4c44-42ce-bc72-bd4ded5cac2a"],"sql_source":"bridge_table","term_id":"b611e9c3-38c3-43d4-ba5e-e1a9c4295b38"}'
    description: Links members to events they attended via the attendance bridge table.
  - name: link_to_major
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: link_to_major
    datatype: String
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
  - name: zip
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: zip
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
- name: zip_code
  source: d2_student_club.public.zip_code
