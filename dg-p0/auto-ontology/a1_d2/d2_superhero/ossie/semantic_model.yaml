version: 0.2.0.dev0
name: d2_superhero
datasets:
- name: alignment_record
  source: d2_superhero.public.alignment
  unique_keys:
  - - record_id
  fields:
  - name: alignment_status
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: alignment
    datatype: String
    description: Categorical status indicating moral or ethical alignment quality,
      with values Good, Bad, Neutral, or N/A.
  - name: record_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    datatype: Integer
    description: Unique identifier for each alignment record, linking superheroes
      to their alignment classification.
- name: attribute
  source: d2_superhero.public.attribute
  description: A quantifiable characteristic or trait that can be assigned to an entity,
    such as Intelligence or Strength.
  unique_keys:
  - - attribute_id
  fields:
  - name: attribute_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: attribute_name
    datatype: String
    description: The descriptive name of a quantifiable characteristic, such as Intelligence
      or Strength.
  - name: attribute_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    datatype: Integer
    description: A unique numeric identifier for each attribute, referenced by hero
      attributes to link heroes to their attributes.
- name: colour
  source: d2_superhero.public.colour
  description: A colour reference used to describe product colour attributes, including
    solid colours and multi-colour combinations.
  unique_keys:
  - - id
  fields:
  - name: id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    datatype: Integer
    description: Unique identifier for a colour reference, used to link superhero
      eye, hair, and skin colour attributes.
  - name: colour
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: colour
    datatype: String
    description: Text value representing a product colour, including solid colours
      and multi-colour combinations such as 'Black/Blue'.
- name: gender
  source: d2_superhero.public.gender
  description: Gender classification reference data.
  unique_keys:
  - - gender_id
  fields:
  - name: gender_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    datatype: Integer
    description: Unique numeric identifier for each gender classification, used to
      link superheroes to their gender.
  - name: gender
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: gender
    datatype: String
    description: 'Text value representing the gender classification: Male, Female,
      or N/A for not applicable.'
- name: hero_attribute
  source: d2_superhero.public.hero_attribute
  fields:
  - name: attribute_value
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: attribute_value
    datatype: Integer
    description: 'attribute_value: The numeric score or measurement for a hero attribute,
      stored as a large integer.'
  - name: attribute_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: attribute_id
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
  - name: hero_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: hero_id
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
- name: publisher
  source: d2_superhero.public.publisher
  unique_keys:
  - - id
  fields:
  - name: publisher_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: publisher_name
    datatype: String
    description: Records the publisher's name, such as DC Comics or Dark Horse Comics,
      which may be blank.
  - name: id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    datatype: Integer
    description: Identifies each publisher uniquely and links superheroes to their
      publishing company.
- name: race
  source: d2_superhero.public.race
  unique_keys:
  - - race_id
  fields:
  - name: race_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    datatype: Integer
    description: Unique numeric identifier for each race, referenced by superheroes
      to indicate their race.
  - name: race_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: race
    datatype: String
    description: Textual name categorizing a race or species, using a dash for unknown
      values.
- name: superhero
  source: d2_superhero.public.superhero
  unique_keys:
  - - superhero_id
  fields:
  - name: superhero_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: superhero_name
    datatype: String
    description: The public or code name by which the superhero is known.
  - name: height_cm
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: height_cm
    datatype: Integer
    description: The superhero's height in centimeters, where 0.0 denotes missing
      or unknown data.
  - name: superhero_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    datatype: Integer
    description: Identifies the superhero and links to their attributes and powers.
  - name: full_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: full_name
    datatype: String
    description: The civilian or legal name of the superhero, with a hyphen indicating
      unknown.
  - name: weight_kg
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: weight_kg
    datatype: Integer
    description: The superhero's weight in kilograms, where 0.0 denotes missing or
      unknown data.
  - name: skin_colour_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: skin_colour_id
    datatype: Integer
    custom_extensions:
