    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
  - name: publisher_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: publisher_id
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
  - name: alignment_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: alignment_id
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
