version: 0.2.0.dev0
name: d2_european_football_2
datasets:
- name: country
  source: d2_european_football_2.public.country
  description: A country reference entity.
  unique_keys:
  - - country_id
  fields:
  - name: country_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    datatype: Integer
    description: A unique numeric identifier for each country, referenced by leagues
      and matches to indicate the country they belong to.
  - name: country_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: name
    datatype: String
    description: The official name of the country, such as Belgium, England, or Germany.
- name: football_league
  source: d2_european_football_2.public.league
  description: A football league entity with its identifier and official name.
  unique_keys:
  - - league_id
  fields:
  - name: league_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: name
    datatype: String
    description: Official league name combining country and competition title, e.g.,
      England Premier League.
  - name: league_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    datatype: Integer
    description: Unique numeric identifier for a football league, used to link matches
      to their league.
  - name: country_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: country_id
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
- name: match
  source: d2_european_football_2.public.match
  description: A football match with its metadata, scores, and player lineup/position
    data.
  fields:
  - name: away_player_x6
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: away_player_x6
    datatype: Integer
    description: Captures the x-coordinate of the away team's sixth player on the
      field during the match.
  - name: home_player_y3
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: home_player_y3
    datatype: Integer
    description: Records the vertical field coordinate of the home team's third player
      in the match.
  - name: home_team_goals
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: home_team_goal
    datatype: Integer
    description: Number of goals scored by the home team.
  - name: away_player_x2
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: away_player_x2
    datatype: Integer
    description: Captures the x-coordinate of the away team's second player on the
      field during the match.
  - name: match_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: date
    datatype: String
    description: Date and time of the match in YYYY-MM-DD HH:MM:SS format.
  - name: home_player_x5
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: home_player_x5
    datatype: Integer
    description: Player identifier for the home team's starting lineup position 5.
  - name: psh
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: psh
    datatype: Float
    description: Indicates the decimal odds offered by Pinnacle Sports for a home
      team win in the match.
  - name: whh
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: whh
    datatype: Float
    description: Indicates the decimal odds offered by William Hill for a home team
      win in the match.
  - name: vcd
    expression:
      dialects:
