version: 0.2.0.dev0
name: d2_european_football_2_ontology
description: Business concepts of the d2_european_football_2 semantic model
ontology:
- concept: Country
  type: EntityType
  description: A country reference entity.
  identify_by:
  - country_id
  relationships:
  - name: country_id
    description: A unique numeric identifier for each country, referenced by leagues
      and matches to indicate the country they belong to.
    roles:
    - concept: Integer
    multiplicity: OneToOne
    verbalizes:
    - '{Country} is identified by country id {Integer}'
  - name: country_name
    description: The official name of the country, such as Belgium, England, or Germany.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{Country} has country name {String}'
- concept: FootballLeague
  type: EntityType
  description: A football league entity with its identifier and official name.
  identify_by:
  - league_id
  relationships:
  - name: league_name
    description: Official league name combining country and competition title, e.g.,
      England Premier League.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{FootballLeague} has league name {String}'
  - name: league_id
    description: Unique numeric identifier for a football league, used to link matches
      to their league.
    roles:
    - concept: Integer
    multiplicity: OneToOne
    verbalizes:
    - '{FootballLeague} is identified by league id {Integer}'
  - name: country
    roles:
    - concept: Country
    multiplicity: ManyToOne
    verbalizes:
    - '{FootballLeague} has {Country}'
- concept: Match
  type: EntityType
  description: A football match with its metadata, scores, and player lineup/position
    data.
  relationships:
  - name: away_player_x6
    description: Captures the x-coordinate of the away team's sixth player on the
      field during the match.
    roles:
    - concept: Integer
    multiplicity: ManyToOne
    verbalizes:
    - '{Match} has away player x6 {Integer}'
  - name: home_player_y3
    description: Records the vertical field coordinate of the home team's third player
      in the match.
    roles:
    - concept: Integer
    multiplicity: ManyToOne
    verbalizes:
    - '{Match} has home player y3 {Integer}'
  - name: home_team_goals
