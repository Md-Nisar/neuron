data_layer:
  databases:
  - id: 3e857448-166a-45e0-9504-99e3259c225a
    dialect: postgres
    schemas:
    - id: 85f2f820-b69f-496d-b771-eb7227b8d41d
      name: public
      database_name: d2_card_games
      tables:
      - id: d13c5514-c0fa-49e1-abc9-06a40e091656
        name: cards
        description: ''
        pk: []
        type: base table
        columns:
        - id: d0db4622-db3b-4602-84d7-b332b90d9b69
          name: id
          description: Unique identifier for each card record in the dataset.
          type: bigint
          sample_values:
          - 1
          - 2
          - 3
          - 4
          - 5
          is_nullable: false
          is_unique: true
        - id: 0660e1a2-14dd-4f0d-b6a1-a5df9fa9edb5
          name: artist
          description: Name of the artist who illustrated the card.
          type: text
          sample_values:
          - Dan Frazier
          - Douglas Shuler
          - Kev Walker
          - Anson Maddocks
          - Mark Poole
          is_nullable: true
          is_unique: false
        - id: 31ea1d2e-3a90-4382-b2e3-a7e9990e2733
          name: asciiname
          description: ASCII-only representation of the card name for compatibility
            with systems that do not support Unicode characters.
          type: text
          sample_values: []
          is_nullable: true
          is_unique: false
        - id: 3cef6b6e-cc42-480f-9a8f-a276b7410a64
          name: availability
          description: Comma-separated list of platforms or formats where the card
            is available, such as MTGO, paper, Arena, Dreamcast, or Shandalar.
          type: text
          sample_values:
          - mtgo,paper
          - paper
          - arena
          - mtgo
          - dreamcast
          - arena,mtgo
          - arena,paper
          - shandalar
          - arena,mtgo,paper
          is_nullable: true
          is_unique: false
        - id: c2825615-39cf-4f35-b346-ca583924b656
          name: bordercolor
          description: Color or style of the card's border, such as black, white,
            borderless, silver, or gold.
          type: text
          sample_values:
          - black
          - white
          - borderless
          - silver
          - gold
          is_nullable: true
          is_unique: false
        - id: f3dd57b3-fb3d-4a28-957a-3429505f034c
          name: cardkingdomfoilid
          description: Card Kingdom product identifier for the foil version of the
            card.
          type: text
          sample_values:
          - '123094'
          - '123095'
          - '123096'
          - '123097'
          - '123098'
          is_nullable: true
          is_unique: true
        - id: a4d7e0c3-1cf8-4d28-93c2-f246780df139
          name: cardkingdomid
          description: Card Kingdom product identifier for the non-foil version of
            the card.
          type: text
          sample_values:
          - '122719'
          - '122720'
          - '122725'
          - '122726'
          - '122727'
          is_nullable: true
          is_unique: true
        - id: fc5e9e63-8059-4608-b91d-ca0a797764c1
          name: coloridentity
          description: Color identity of the card using single-letter codes (W, U,
            B, R, G) for Commander format legality.
          type: text
          sample_values:
          - W
          - U
          - R
          - B
          - G
          is_nullable: true
          is_unique: false
        - id: 5a7805ac-e94b-47d7-bd52-792e65f0a08f
          name: colorindicator
          description: Color indicator of the card using single-letter codes, representing
            its color when not defined by mana cost.
          type: text
          sample_values:
          - B
          - B,G
          - B,R,U
          - G
          - G,R
          - G,R,W
          - R
          - U
          - W
          is_nullable: true
          is_unique: false
        - id: c01f3560-8d57-4e09-8d46-ab90f8492281
          name: colors
          description: Colors of the card as defined by its mana cost, represented
            by single-letter codes (W, U, B, R, G).
          type: text
          sample_values:
          - W
          - U
          - R
          - B
          - G
          is_nullable: true
          is_unique: false
        - id: ae530abc-e46c-4c17-af71-6abfb83afdc2
          name: convertedmanacost
          description: Total converted mana cost of the card, calculated as the sum
            of all mana symbols in its cost.
          type: real
          sample_values:
          - 3.0
          - 1.0
          - 2.0
          - 4.0
          - 5.0
          is_nullable: true
          is_unique: false
        - id: 6de2bad1-a05b-4175-b48c-8451aeb989d3
          name: dueldeck
          description: Identifier for the Duel Deck product the card belongs to, if
            any (e.g., 'a' or 'b' for the two decks in a set).
          type: text
          sample_values:
          - b
          - a
          is_nullable: true
          is_unique: false
        - id: 991ad1ac-fc97-4b71-927c-cd37e5434008
          name: edhrecrank
          description: Popularity rank of the card on EDHREC, where a lower number
            indicates higher usage in Commander decks.
          type: bigint
          sample_values:
          - 11535.0
          - 9891.0
          - 4659.0
          - 11649.0
          - 17950.0
          is_nullable: true
          is_unique: false
        - id: 89ae6b4e-f74e-4478-bbec-61140727d631
          name: faceconvertedmanacost
          description: Converted mana cost of a specific face of a double-faced card.
          type: real
          sample_values: []
          is_nullable: true
          is_unique: false
        - id: 95efa61c-ce1b-4d16-bdb6-ccb9800dc92f
          name: facename
          description: Name of a specific face of a double-faced card.
          type: text
          sample_values: []
          is_nullable: true
          is_unique: false
        - id: beddfb40-a2cf-4ed4-9612-cdf83084b8b1
          name: flavorname
          description: The flavorname column stores the thematic or lore-based name
            of a card, such as character titles from the Godzilla franchise crossover.
          type: text
          sample_values:
          - Anguirus, Armored Killer
          - Babygodzilla, Ruin Reborn
          - Battra, Dark Destroyer
          - Bio-Quartz Spacegodzilla
          - Biollante, Plant Beast Form
          - Destoroyah, Perfect Lifeform
          - Dorat, the Perfect Pet
          - Ghidorah, King of the Cosmos
          - Gigan, Cyberclaw Terror
          - Godzilla, Doom Inevitable
          - Godzilla, King of the Monsters
          - Godzilla, Primeval Champion
          - King Caesar, Ancient Guardian
          - King Caesar, Awoken Titan
          - Mechagodzilla, Battle Fortress
          - Mechagodzilla, the Weapon
          - Mothra's Great Cocoon
          - Mothra, Supersonic Queen
          - Rodan, Titan of Winged Fury
          - Spacegodzilla, Death Corona
          - Spacegodzilla, Void Invader
          is_nullable: true
          is_unique: false
        - id: d2d80843-33e5-4204-a091-c6dda84a466c
          name: flavortext
          description: The flavortext column contains the narrative quotation printed
            on a card to provide lore context or storytelling flavor.
          type: text
          sample_values: []
          is_nullable: true
          is_unique: false
        - id: 9d4946f9-a566-4db7-bb6d-75f22e50830f
          name: frameeffects
          description: The frameeffects column identifies special visual frame treatments
            applied to a card, such as the legendary frame style.
          type: text
          sample_values:
          - legendary
          is_nullable: true
          is_unique: false
        - id: 063a6f7c-f53f-4bee-9cb7-fc1216182029
          name: frameversion
          description: The frameversion column denotes the card frame design era or
            version, indicated by year labels or special designations like "future".
          type: text
          sample_values:
          - '2003'
          - '1993'
          - '2015'
          - future
          - '1997'
          is_nullable: true
          is_unique: false
        - id: 4536aacb-dfa7-4e64-baae-c6390a7cbbb9
          name: hand
          description: The hand column records the hand size modifier associated with
            a card, represented as positive, negative, or zero integer values.
          type: text
          sample_values:
          - '-1'
          - '-2'
          - '-3'
          - '-4'
          - '0'
          - '1'
          - '2'
          - '3'
          is_nullable: true
          is_unique: false
        - id: ec1bfa34-7f10-4d14-aa41-7b3170167fd4
          name: hasalternativedecklimit
          description: The hasalternativedecklimit column is a binary flag indicating
            whether a card exempts the standard deck construction limit (1 = yes,
            0 = no).
          type: bigint
          sample_values:
          - 0
          - 1
          is_nullable: true
          is_unique: false
        - id: 376f30e4-8314-4112-ae02-3cb683165b8c
          name: hascontentwarning
          description: The hascontentwarning column is a binary flag signaling whether
            a card carries a content advisory for sensitive material (1 = yes, 0 =
            no).
          type: bigint
          sample_values:
          - 0
          - 1
          is_nullable: true
          is_unique: false
        - id: 5039cfcf-d47d-44d9-abb4-4e03727e173d
          name: hasfoil
          description: The hasfoil column is a binary flag denoting the existence
            of a foil-printed version of the card (1 = available, 0 = not available).
          type: bigint
          sample_values:
          - 1
          - 0
          is_nullable: true
          is_unique: false
        - id: f3a6d5fc-5dfc-449c-b282-9c4a9518ef13
          name: hasnonfoil
          description: The hasnonfoil column is a binary flag denoting the existence
            of a non-foil printed version of the card (1 = available, 0 = not available).
          type: bigint
          sample_values:
          - 1
          - 0
          is_nullable: true
          is_unique: false
        - id: bedbf841-6959-4a2d-b0c8-75344d359b11
          name: isalternative
          description: The isalternative column is a binary flag identifying whether
            a card is an alternate version, such as alternate art or borderless treatment
            (1 = yes, 0 = no).
          type: bigint
          sample_values:
          - 0
          - 1
          is_nullable: true
          is_unique: false
        - id: c8782995-8ed9-44a6-9de3-71830119e305
          name: isfullart
          description: The isfullart column is a binary flag indicating whether a
            card features full-art illustration extending to the card borders (1 =
            yes, 0 = no).
          type: bigint
          sample_values:
          - 0
          is_nullable: true
          is_unique: false
        - id: de846506-2fe2-411b-82e6-1dc8683349f5
          name: isonlineonly
          description: The isonlineonly column is a binary flag specifying whether
            a card is exclusively available on the digital platform Magic Online (1
            = digital-only, 0 = physical exists).
          type: bigint
          sample_values:
          - 0
          - 1
          is_nullable: true
          is_unique: false
        - id: 870b4113-a1ec-4c9c-8e88-76a3e18127ad
          name: isoversized
          description: The isoversized column is a binary flag marking whether a card
            is produced in an oversized physical format (1 = yes, 0 = no).
          type: bigint
          sample_values:
          - 0
          is_nullable: true
          is_unique: false
        - id: 0972291f-dad6-49fd-af40-cc365b5231f1
          name: ispromo
          description: The ispromo column is a binary flag indicating whether a card
            was released as a promotional product (1 = yes, 0 = no).
          type: bigint
          sample_values:
          - 0
          is_nullable: true
          is_unique: false
        - id: 1c6b22e7-a783-4189-849b-bec588655f5f
          name: isreprint
          description: The isreprint column is a binary flag showing whether a card
            is a reissue of a previously printed card (1 = reprint, 0 = original printing).
          type: bigint
          sample_values:
          - 1
          is_nullable: true
          is_unique: false
        - id: c5b8d59f-5d6e-4f7c-ad3f-0f77e9f5457f
          name: isreserved
