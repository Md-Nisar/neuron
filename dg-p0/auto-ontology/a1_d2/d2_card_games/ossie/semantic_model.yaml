version: 0.2.0.dev0
name: d2_card_games
datasets:
- name: card
  source: d2_card_games.public.cards
  description: 'Represents a Magic: The Gathering card with all its attributes, printing
    details, and gameplay characteristics.'
  unique_keys:
  - - uuid
  fields:
  - name: hasnonfoil
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: hasnonfoil
    datatype: Integer
    description: The non-foil availability flag indicates whether a non-foil printed
      version of the card exists (1 = available, 0 = not available).
  - name: is_full_art
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: isfullart
    datatype: Integer
    description: The full-art flag indicates whether the card features a full-art
      illustration extending to the card borders (1 = yes, 0 = no).
  - name: hand_modifier
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: hand
    datatype: String
    description: The hand modifier adjusts the player's hand size by a positive, negative,
      or zero integer value.
  - name: is_oversized
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: isoversized
    datatype: Integer
    description: The oversized flag marks whether the card is produced in an oversized
      physical format (1 = yes, 0 = no).
  - name: mcmmetaid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: mcmmetaid
    datatype: String
    description: Holds the Cardmarket metadata identifier for the card's printing.
  - name: scryfallillustrationid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: scryfallillustrationid
    datatype: String
    description: Unique Scryfall identifier for the card's illustration.
  - name: is_starter
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: isstarter
    datatype: Integer
    description: Identifies if the card comes from a starter product (1 = yes, 0 =
      no).
  - name: has_alternative_deck_limit
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: hasalternativedecklimit
    datatype: Integer
    description: The alternative deck limit flag indicates whether the card exempts
      the standard deck construction limit (1 = yes, 0 = no).
  - name: leadership_skills
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: leadershipskills
    datatype: String
    description: Specifies the card's commander eligibility for Brawl, Commander,
      and Oathbreaker formats.
  - name: power
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: power
    datatype: String
    description: Specifies the power value of a creature card for combat damage as
      text.
  - name: is_textless
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: istextless
    datatype: Integer
    description: Indicates if the card is a textless promotional version (1 = yes,
      0 = no).
  - name: flavor_text
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: flavortext
    datatype: String
    description: The flavor text provides a narrative quotation printed on the card
      to convey lore or storytelling context.
  - name: side
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: side
    datatype: String
    description: Designates the face of a double-faced or multi-faced card (e.g.,
      a, b).
  - name: mtgarenaid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: mtgarenaid
    datatype: String
    description: Contains the MTG Arena internal identifier for the card.
  - name: converted_mana_cost
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: convertedmanacost
    datatype: Float
    description: Represents the total converted mana cost of the card as a numeric
      value.
  - name: life_modifier
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: life
    datatype: String
    description: Provides the life total modifier for Vanguard or Plane cards as a
      negative number.
  - name: keywords
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: keywords
    datatype: String
    description: Lists the keyword abilities on the card, such as Flying or Trample.
  - name: artist
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: artist
    datatype: String
    description: Identifies the artist who illustrated the Magic card.
  - name: layout
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: layout
    datatype: String
    description: Defines the physical card layout or frame type, like normal, split,
      or modal double-faced.
  - name: edhrec_rank
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: edhrecrank
    datatype: Integer
    description: Shows the card's popularity rank on EDHREC, with lower numbers meaning
      higher Commander usage.
  - name: card_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    datatype: Integer
    description: 'Uniquely identifies each Magic: The Gathering card record in the
      dataset.'
  - name: border_color
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: bordercolor
    datatype: String
    description: Specifies the border color or style of the card, such as black or
      borderless.
  - name: is_promo
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ispromo
    datatype: Integer
    description: The promo flag indicates whether the card was released as a promotional
      product (1 = yes, 0 = no).
  - name: otherfaceids
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: otherfaceids
    datatype: String
    description: Lists identifiers for the other faces of a double-faced or meld card.
  - name: mtgoid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: mtgoid
    datatype: String
    description: Identifies the non-foil version of a card on Magic Online using a
      numeric text code.
  - name: setcode
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: setcode
    datatype: String
    description: Abbreviated code identifying the Magic set the card belongs to (e.g.,
      10E).
  - name: has_foil
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: hasfoil
    datatype: Integer
    description: The foil availability flag indicates whether a foil-printed version
      of the card exists (1 = available, 0 = not available).
  - name: mcmid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: mcmid
    datatype: String
    description: Stores the Cardmarket identifier for the card.
  - name: text
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: text
    datatype: String
    description: Contains the rules text or abilities printed on the card (e.g., Flying).
  - name: originalreleasedate
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: originalreleasedate
    datatype: String
    description: Records the original release date of the card's first printing as
      text.
  - name: scryfalloracleid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: scryfalloracleid
    datatype: String
    description: Unique Scryfall identifier for the card's oracle text.
  - name: multiverseid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: multiverseid
    datatype: String
    description: Identifies the card in Wizards of the Coast's Multiverse database
      using a numeric text code.
  - name: watermark
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: watermark
    datatype: String
    description: Identifies the faction or organization symbol printed on the card.
  - name: color_identity
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: coloridentity
    datatype: String
    description: Defines the card's color identity using single-letter codes for Commander
      format legality.
  - name: is_online_only
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: isonlineonly
    datatype: Integer
    description: The online-only flag specifies whether the card is exclusively available
      on the digital platform Magic Online (1 = digital-only, 0 = physical exists).
  - name: is_reserved
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: isreserved
    datatype: Integer
    description: Flags whether the card is on the Reserved List (1 = yes, 0 = no),
      meaning it will never be reprinted.
  - name: mtgjsonv4id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: mtgjsonv4id
    datatype: String
    description: Keeps the MTGJSON v4 unique identifier for the card.
  - name: type
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: type
    datatype: String
    description: Full card type line including types and subtypes as printed (e.g.,
      Enchantment — Aura).
  - name: has_content_warning
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: hascontentwarning
    datatype: Integer
    description: The content warning flag signals whether the card carries a content
      advisory for sensitive material (1 = yes, 0 = no).
  - name: toughness
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: toughness
    datatype: String
    description: Represents the creature's toughness value as printed (e.g., 1, 2,
      3).
  - name: face_converted_mana_cost
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: faceconvertedmanacost
    datatype: Float
    description: Provides the converted mana cost for a specific face of a double-faced
      card.
  - name: originaltype
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: originaltype
    datatype: String
    description: Shows the original card type line as printed on the card's first
      release.
  - name: number
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: number
    datatype: String
    description: Indicates the collector number of the card within its set as text.
  - name: frame_version
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: frameversion
    datatype: String
    description: The frame version identifies the card's frame design era using a
      year format (YYYY) or special designation like 'future'.
  - name: card_kingdom_foil_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: cardkingdomfoilid
    datatype: String
    description: Identifies the Card Kingdom product ID for the foil version of the
      card.
  - name: originaltext
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: originaltext
    datatype: String
    description: Contains the original rules text printed on the card at its first
      release.
  - name: card_kingdom_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: cardkingdomid
    datatype: String
    description: Identifies the Card Kingdom product ID for the non-foil version of
      the card.
  - name: rarity
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: rarity
    datatype: String
    description: Classifies the rarity level of the card in its set as common, uncommon,
      rare, or mythic.
  - name: supertypes
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: supertypes
    datatype: String
    description: Indicates special supertypes like Basic, Legendary, or Snow (e.g.,
      Basic, Legendary).
  - name: ascii_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: asciiname
    datatype: String
    description: Provides an ASCII-only version of the card name for systems lacking
      Unicode support.
  - name: uuid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: uuid
    datatype: String
    description: Universally unique identifier for the card instance, referenced by
      foreign data and rulings.
  - name: name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: name
    datatype: String
    description: 'States the official name of the Magic: The Gathering card.'
  - name: loyalty
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: loyalty
    datatype: String
    description: Gives the starting loyalty value for planeswalker cards.
  - name: flavor_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: flavorname
    datatype: String
    description: The flavor name provides a thematic or lore-based title for the card,
      such as character designations from crossover franchises.
  - name: printings
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: printings
    datatype: String
    description: Enumerates the set codes in which the card has been printed.
  - name: mtgofoilid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: mtgofoilid
    datatype: String
    description: Identifies the foil version of a card on Magic Online using a numeric
      text code.
  - name: manacost
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: manacost
    datatype: String
    description: Displays the card's mana cost in symbolic notation, e.g., {W} or
      {2}{R}.
  - name: tcgplayerproductid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: tcgplayerproductid
    datatype: String
    description: Product identifier for the card on the TCGplayer marketplace (e.g.,
      15032).
  - name: colors
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: colors
    datatype: String
    description: Lists the card's colors derived from its mana cost using single-letter
      codes.
  - name: face_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: facename
    datatype: String
    description: Gives the name of a specific face of a double-faced card.
  - name: duel_deck
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: dueldeck
    datatype: String
    description: Identifies the Duel Deck product and side (a or b) the card belongs
      to.
  - name: types
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: types
    datatype: String
    description: Primary card types such as Creature, Instant, or Enchantment (e.g.,
      Creature, Instant).
  - name: purchaseurls
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: purchaseurls
    datatype: String
    description: Provides URLs for purchasing the card from various online retailers.
  - name: color_indicator
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: colorindicator
    datatype: String
    description: Indicates the card's color via color indicator using single-letter
      codes when not defined by mana cost.
  - name: is_reprint
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: isreprint
    datatype: Integer
    description: The reprint flag shows whether the card is a reissue of a previously
      printed card (1 = reprint, 0 = original printing).
  - name: availability
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: availability
    datatype: String
    description: Lists the platforms where the card is available as a comma-separated
      value.
  - name: variations
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: variations
    datatype: String
    description: List of UUIDs for alternate versions or printings of the same card.
  - name: is_story_spotlight
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: isstoryspotlight
    datatype: Integer
    description: Marks if the card is a Story Spotlight card (1 = yes, 0 = no).
  - name: promotypes
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: promotypes
    datatype: String
    description: Describes the types of promotional releases associated with the card.
  - name: is_timeshifted
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: istimeshifted
    datatype: Integer
    description: Shows whether the card is a timeshifted reprint (1 = yes, 0 = no).
  - name: subtypes
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: subtypes
    datatype: String
    description: Lists creature, enchantment, or other subtypes associated with the
      card (e.g., Aura, Human).
  - name: scryfallid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: scryfallid
    datatype: String
    description: 'Identifies the card on Scryfall, a Magic: The Gathering database.'
  - name: frame_effects
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: frameeffects
    datatype: String
    description: The frame effect indicates special visual frame treatments applied
      to the card, such as legendary styling.
  - name: is_alternative
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: isalternative
    datatype: Integer
    description: The alternative version flag identifies whether the card is an alternate
      version, such as alternate art or borderless treatment (1 = yes, 0 = no).
- name: card_legality
  source: d2_card_games.public.legalities
  fields:
  - name: game_format
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: format
    datatype: String
    description: 'Specifies the Magic: The Gathering game format, such as Commander
      or Modern, governing the card''s legality.'
  - name: id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    datatype: Integer
    description: Uniquely identifies each card legality record with a sequential numeric
      key.
  - name: global_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: uuid
    datatype: String
    description: Provides a globally unique identifier for cross-system referencing
      of the card legality record.
  - name: legality_status
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: status
    datatype: String
    description: Indicates the card's legal standing in the format, with values Legal,
      Banned, or Restricted.
- name: localized_card_data
  source: d2_card_games.public.foreign_data
  description: Localized card information including name, rules text, flavor text,
    and type for a specific language.
  fields:
  - name: language
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: language
    datatype: String
    description: Language of the localized card name, rules text, and flavor text.
  - name: multiverseid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: multiverseid
    datatype: Integer
    description: 'Identifies the Magic: The Gathering card in the Multiverse database.'
  - name: record_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    datatype: Integer
    description: Unique identifier for each localized card data record.
  - name: rules_text
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: text
    datatype: String
    description: Localized rules text describing the card's abilities in the specified
      language.
  - name: card_type
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: type
    datatype: String
    description: Localized card type classification in the specified language.
  - name: name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: name
    datatype: String
    description: Localized name of the card in the specified language.
  - name: flavor_text
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: flavortext
    datatype: String
    description: Localized flavor text for the card in the specified language.
  - name: uuid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: uuid
    datatype: String
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
- name: magic_set
  source: d2_card_games.public.sets
  unique_keys:
  - - set_code
  fields:
  - name: mtgo_code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: mtgocode
    datatype: String
    description: 'Specifies the set code used on Magic: The Gathering Online for digital
      representation and redemption.'
  - name: set_code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: code
    datatype: String
    description: Represents the official three- to four-character abbreviated set
      code used in translations and parent set references.
  - name: set_type
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: type
    datatype: String
    description: The classification of the Magic product, such as expansion, promo,
      memorabilia, box, or duel deck.
  - name: is_non_foil_only
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: isnonfoilonly
    datatype: Integer
    description: Flags whether the set contains only non-foil cards (1) or includes
      foil cards (0).
  - name: is_foreign_only
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: isforeignonly
    datatype: Integer
    description: Indicates whether the set is printed exclusively in non-English languages
      (1) or not (0).
  - name: block
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: block
    datatype: String
    description: Categorizes the set by product line, block, or promotional category
      such as Core Set or Commander.
  - name: release_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: releasedate
    datatype: Date
    description: The official release date of the Magic set, formatted as YYYY-MM-DD.
  - name: mcm_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: mcmname
    datatype: String
    description: States the set name as listed on the Cardmarket marketplace for identification
      and search.
  - name: is_partial_preview
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ispartialpreview
    datatype: Integer
    description: Flags whether the set is a partial preview release (1) or a full
      release (0).
  - name: total_set_size
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: totalsetsize
    datatype: Integer
    description: The total count of cards included in the Magic set.
  - name: base_set_size
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: basesetsize
    datatype: Integer
    description: Indicates the base count of distinct cards in the set, excluding
      foil, promo, and variant cards.
  - name: is_foil_only
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: isfoilonly
    datatype: Integer
    description: Flags whether the set contains only foil cards (1) or includes non-foil
      cards (0).
  - name: mcmid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: mcmid
    datatype: Integer
    description: Identifies the set's product listing on the Cardmarket marketplace
      with a unique numeric identifier.
  - name: booster_configuration
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: booster
    datatype: String
    description: Defines the booster pack configuration as a JSON structure detailing
      card slots, weights, and sheet distributions.
  - name: set_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    datatype: Integer
    description: 'Uniquely identifies each Magic: The Gathering set or product with
      a numeric identifier.'
  - name: tcgplayergroupid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: tcgplayergroupid
    datatype: Integer
    description: A TCGPlayer grouping identifier that categorizes related product
      printings and conditions under a single product group.
  - name: set_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: name
    datatype: String
    description: 'The official full name identifying a Magic: The Gathering set, such
      as ''Tenth Edition'' or ''Double Masters''.'
  - name: mcmidextras
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: mcmidextras
    datatype: Integer
    description: Provides a supplementary Cardmarket identifier to distinguish variant
      or additional product entries for the set.
  - name: is_online_only
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: isonlineonly
    datatype: Integer
    description: 'Indicates whether the set is exclusive to Magic: The Gathering Online
      (1) or also available physically (0).'
  - name: keyrune_code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: keyrunecode
    datatype: String
    description: Provides an internal system code for set identification on platforms
      using Keyrune or symbol encoding.
  - name: parentcode
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: parentcode
    datatype: String
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
- name: ruling
  source: d2_card_games.public.rulings
  description: 'A Magic: The Gathering rule or card ruling entry.'
  fields:
  - name: effective_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: date
    datatype: Date
    description: Effective date of the ruling in YYYY-MM-DD format indicating when
      the rule becomes applicable.
  - name: ruling_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    datatype: Integer
    description: 'Unique numeric identifier assigned to each Magic: The Gathering
      rule or card ruling entry.'
  - name: ruling_text
    expression:
      dialects:
      - dialect: ANSI_SQL
