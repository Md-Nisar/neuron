version: 0.2.0.dev0
name: d2_debit_card_specializing
datasets:
- name: customer
  source: d2_debit_card_specializing.public.customers
  unique_keys:
  - - customer_id
  fields:
  - name: segment
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: segment
    datatype: String
    description: Classifies the customer into a business segment such as SME, LAM,
      or KAM.
  - name: currency
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: currency
    datatype: String
    description: Indicates the currency code associated with the customer, using standard
      codes like CZK or EUR.
  - name: customer_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: customerid
    datatype: Integer
    description: Unique identifier for each customer, used to link customer records
      to monthly performance data.
- name: gas_station
  source: d2_debit_card_specializing.public.gasstations
  unique_keys:
  - - gas_station_id
  fields:
  - name: segment
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: segment
    datatype: String
    description: Categorizes the gas station by brand or pricing tier such as Premium
      or Discount.
  - name: chainid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: chainid
    datatype: Integer
    description: Identifies the fuel chain to which the gas station belongs.
  - name: gas_station_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: gasstationid
    datatype: Integer
    description: Unique identifier for a gas station, used to link transactions to
      the specific station.
  - name: country
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: country
    datatype: String
    description: ISO country code specifying the country where the gas station operates.
- name: product
  source: d2_debit_card_specializing.public.products
  unique_keys:
  - - product_id
  fields:
  - name: description
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: description
    datatype: String
    description: Textual category label classifying the product type, such as food
      or service fee.
  - name: product_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: productid
    datatype: Integer
    description: Unique numeric identifier for each product, used to link products
      to transactions.
- name: transaction
  source: d2_debit_card_specializing.public.transactions_1k
  description: A single transaction record.
  fields:
  - name: transaction_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: transactionid
    datatype: Integer
    description: Uniquely identifies each transaction record.
  - name: cardid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: cardid
    datatype: Integer
    description: Identifies the payment or loyalty card used for the transaction.
  - name: date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: date
    datatype: Date
    description: Records the calendar date of the transaction in YYYY-MM-DD format.
  - name: price
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: price
    datatype: Float
    description: Records the monetary value of the transaction in decimal currency
      units.
  - name: customerid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: customerid
    datatype: Integer
    description: Identifies the customer who made the transaction.
  - name: time
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: time
    datatype: String
    description: Captures the time of day the transaction was recorded in HH:MM:SS
      format.
  - name: quantity
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: amount
    datatype: Integer
    description: Represents the quantity of items in the transaction.
  - name: gasstationid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: gasstationid
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
  - name: productid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: productid
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
- name: year_month
  source: d2_debit_card_specializing.public.yearmonth
  description: A reporting period with its associated consumption value.
  fields:
  - name: consumption
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: consumption
    datatype: Float
    description: Records the consumption amount for the reporting period.
  - name: period
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: date
    datatype: String
    description: Represents the reporting period in YYYYMM text format.
  - name: customerid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: customerid
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
