version: 0.2.0.dev0
name: d2_codebase_community
datasets:
- name: badge
  source: d2_codebase_community.public.badges
  description: A role or badge assigned to a user.
  fields:
  - name: badge_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: name
    datatype: String
    description: Specifies the title of the badge or role granted to a user.
  - name: badge_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    datatype: Integer
    description: Uniquely identifies each badge assignment record.
  - name: assigned_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: date
    datatype: DateTimeTz
    description: Records the timestamp with time zone when the badge was awarded.
  - name: userid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: userid
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
- name: comment
  source: d2_codebase_community.public.comments
  description: A user-submitted comment with its score, text, creation timestamp,
    and author display name.
  fields:
  - name: text
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: text
    datatype: String
    description: Text content submitted by the comment author.
  - name: user_display_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: userdisplayname
    datatype: String
    description: Display name of the comment's author.
  - name: creation_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: creationdate
    datatype: DateTimeTz
    description: Timestamp with time zone when the comment was created.
  - name: score
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: score
    datatype: Integer
    description: Numeric community rating of the comment.
  - name: comment_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    datatype: Integer
    description: Identifies each comment uniquely.
  - name: userid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: userid
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
  - name: postid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: postid
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
- name: post
  source: d2_codebase_community.public.posts
  unique_keys:
  - - post_id
  fields:
  - name: body
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: body
    datatype: String
    description: Full textual content of the post stored in HTML format.
  - name: favorite_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: favoritecount
    datatype: Integer
    description: Number of users who have bookmarked the post.
  - name: score
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: score
    datatype: Integer
    description: Net vote score of the post, calculated as upvotes minus downvotes.
  - name: closed_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: closeddate
    datatype: DateTimeTz
    description: Timestamp when the question was closed, if applicable.
  - name: answer_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: answercount
    datatype: Integer
    description: Number of answers submitted for the question.
  - name: last_edit_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: lasteditdate
    datatype: DateTimeTz
    description: Timestamp of the most recent edit made to the post.
  - name: last_editor_display_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: lasteditordisplayname
    datatype: String
    description: lasteditordisplayname is the free-text display name of the user who
      most recently edited the post.
  - name: tags
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: tags
    datatype: String
    description: Topic labels associated with the question, enclosed in angle brackets.
  - name: owner_display_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ownerdisplayname
    datatype: String
    description: ownerdisplayname is the free-text display name of the user who authored
      the post.
  - name: view_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: viewcount
    datatype: Integer
    description: Total number of times the post has been viewed by users.
  - name: last_activity_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: lasactivitydate
    datatype: DateTimeTz
    description: Timestamp of the most recent activity on the post, such as edits,
      answers, or comments.
  - name: posttypeid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: posttypeid
    datatype: Integer
    description: Indicates whether the post is a question (1) or an answer (2).
  - name: creation_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: creaiondate
    datatype: DateTimeTz
    description: Timestamp with time zone of when the post was originally created.
  - name: community_owned_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: communityowneddate
    datatype: DateTimeTz
    description: Timestamp when the post was converted to community-owned status.
  - name: post_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    datatype: Integer
    description: Unique numeric identifier for each post, used by comments, history,
      links, and accepted answer references.
  - name: comment_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: commentcount
    datatype: Integer
    description: Number of comments posted on the post.
  - name: title
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: title
    datatype: String
    description: Headline summarizing the question post.
  - name: owneruserid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: owneruserid
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
  - name: lasteditoruserid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: lasteditoruserid
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
  - name: acceptedanswerid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: acceptedanswerid
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
  - name: parentid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: parentid
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
- name: post_link
  source: d2_codebase_community.public.postlinks
  description: A link between two posts, such as a duplicate or related post reference.
  fields:
  - name: creation_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: creationdate
    datatype: DateTimeTz
    description: Records the exact date and time with time zone when the post link
      was created.
  - name: linktypeid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: linktypeid
    datatype: Integer
    description: Identifies the category of relationship between posts, such as duplicate
      or related, using a numeric code like 1.
  - name: id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    datatype: Integer
    description: Uniquely identifies each post link record with a numeric key such
      as 108 or 264.
  - name: relatedpostid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: relatedpostid
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
  - name: postid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: postid
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
- name: post_revision
  source: d2_codebase_community.public.posthistory
  fields:
  - name: posthistorytypeid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: posthistorytypeid
    datatype: Integer
    description: Categorizes the revision by the type of historical action performed.
  - name: historical_user_display_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: userdisplayname
    datatype: String
    description: Identifies the revising user by their display name, e.g., user28.
  - name: historical_comment
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: comment
    datatype: String
    description: Captures the user's descriptive note explaining the nature of the
      edit.
  - name: historical_creation_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: creationdate
    datatype: DateTimeTz
    description: Records the timestamp with time zone when the revision was created.
  - name: historical_revision_guid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: revisionguid
    datatype: String
    description: Provides a globally unique UUID reference for each revision.
  - name: historical_revision_text
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: text
    datatype: String
    description: Stores the revised content in tag markup format such as <data-visualization>.
  - name: historical_revision_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    datatype: Integer
    description: Uniquely identifies each post revision with a sequential numeric
      key.
  - name: userid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: userid
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
  - name: postid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: postid
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
- name: tag
  source: d2_codebase_community.public.tags
  fields:
  - name: tag_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    datatype: Integer
    description: Uniquely identifies each tag record in the system.
  - name: excerptpostid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: excerptpostid
    datatype: Integer
    description: Identifies the excerpt post associated with the tag.
  - name: count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: count
    datatype: Integer
    description: Indicates the number of occurrences or references linked to the tag.
  - name: tag_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: tagname
    datatype: String
    description: Provides the textual label for a statistical or methodological concept.
  - name: wikipostid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: wikipostid
    datatype: Integer
    description: Identifies the wiki post associated with the tag.
- name: user_account
  source: d2_codebase_community.public.users
  description: Represents a user account in the system, including profile information,
    activity metrics, and reputation.
  unique_keys:
  - - user_id
  fields:
  - name: website_url
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: websiteurl
    datatype: String
    description: User-provided website URL, with 'none' indicating no URL supplied.
  - name: upvotes_received
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: upvotes
    datatype: Integer
    description: Total number of upvotes received on the user's posts.
  - name: last_access_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: lastaccessdate
    datatype: DateTimeTz
    description: Timestamp with time zone of the user's most recent site access or
      login.
  - name: profile_views
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: views
    datatype: Integer
    description: Total count of profile page views by other users.
  - name: location
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: location
    datatype: String
    description: Self-reported geographic location such as country, city, or region.
  - name: downvotes_received
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: downvotes
    datatype: Integer
    description: Total number of downvotes received on the user's posts.
  - name: about_me
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: aboutme
    datatype: String
    description: User-written profile biography in HTML format describing background
      or interests.
  - name: profile_image_url
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: profileimageurl
    datatype: String
    description: URL of the user's profile avatar image hosted on Stack Imgur or Gravatar.
  - name: display_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: displayname
    datatype: String
    description: Public display name chosen by the user for their profile.
  - name: creation_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: creationdate
    datatype: DateTimeTz
    description: Timestamp with time zone of when the user account was created.
  - name: reputation_score
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: reputation
    datatype: Integer
    description: Reputation score indicating community trust earned from contributions.
  - name: accountid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: accountid
    datatype: Integer
    description: Unique account identifier, where -1 denotes a default or placeholder
      account.
  - name: user_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    datatype: Integer
    description: Unique identifier for the user account, where -1 denotes a system
      or anonymous user.
  - name: age
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: age
    datatype: Integer
    description: Self-reported age of the user in years.
- name: vote
  source: d2_codebase_community.public.votes
  fields:
  - name: bounty_amount
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: bountyamount
    datatype: Integer
    description: Specifies the monetary bounty amount associated with the vote.
  - name: vote_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    datatype: Integer
    description: Uniquely identifies each vote record in the system.
  - name: creation_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: creationdate
    datatype: Date
    description: Records the date the vote was cast in YYYY-MM-DD format.
  - name: votetypeid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: votetypeid
    datatype: Integer
    description: Identifies the category of vote cast, such as upvote, downvote, or
      acceptance.
  - name: postid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: postid
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
  - name: userid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: userid
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
