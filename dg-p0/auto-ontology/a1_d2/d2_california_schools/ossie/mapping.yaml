version: 0.2.0.dev0
name: d2_california_schools_mapping
description: Maps the d2_california_schools_ontology onto the d2_california_schools
  semantic model
ontology_ref:
  name: d2_california_schools_ontology
  iri: ./ontology.yaml
semantic_model_ref:
  name: d2_california_schools
  iri: ./semantic_model.yaml
concept_mappings:
- concept: School
  object_mappings:
  - expression: school.cds_code
  link_mappings:
  - object_mapping:
      expression: school.cds_code
    children:
    - object_mapping:
        concept: Float
        expression: school.longitude
      relationship: longitude
    - object_mapping:
        concept: String
        expression: school.phone_number
      relationship: phone_number
    - object_mapping:
        concept: String
        expression: school.educational_operation_name
      relationship: educational_operation_name
    - object_mapping:
        concept: String
        expression: school.nces_district_id
      relationship: nces_district_id
    - object_mapping:
        concept: Integer
        expression: school.charter_flag
      relationship: charter_flag
    - object_mapping:
        concept: String
        expression: school.instructional_level_name
      relationship: instructional_level_name
    - object_mapping:
        concept: String
        expression: school.educational_operation_code
      relationship: educational_operation_code
    - object_mapping:
        concept: String
        expression: school.admfname2
      relationship: admfname2
    - object_mapping:
        concept: String
        expression: school.grades_offered
      relationship: grades_offered
    - object_mapping:
        concept: String
