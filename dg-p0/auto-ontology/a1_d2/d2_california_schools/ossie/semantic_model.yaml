version: 0.2.0.dev0
name: d2_california_schools
datasets:
- name: frpm
  source: d2_california_schools.public.frpm
  description: Business entity represented by table frpm
  fields:
  - name: school_type
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: School Type
    datatype: String
    description: The category of school based on grade levels served and program focus.
  - name: school_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: School Name
    datatype: String
    description: The official name of the school or district office.
  - name: charter_funding_type
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: Charter Funding Type
    datatype: String
    description: The funding mechanism for the charter school, indicating direct state
      funding, local district funding, or exclusion from charter funding model.
  - name: frpm_count_ages5_17
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: FRPM Count (Ages 5-17)
    datatype: Float
    description: Count of students aged 5 through 17 eligible for free or reduced-price
      meals, stored as a real number.
    ai_context:
      synonyms:
      - frpmCount(ages5-17)
  - name: district_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: District Name
    datatype: String
    description: The official name of the school district.
  - name: district_code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: District Code
    datatype: Integer
    description: The unique numeric identifier for the school district.
  - name: percent_eligible_free_k_12
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: Percent (%) Eligible Free (K-12)
    datatype: Float
    description: Proportion of K-12 students eligible for free meals, expressed as
      a decimal between 0 and 1.
    ai_context:
      synonyms:
      - percent(%)EligibleFree(k-12)
  - name: charter_school_number
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: Charter School Number
    datatype: String
    description: The unique four-digit identifier assigned to the charter school.
  - name: academic_year
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: Academic Year
    datatype: String
    description: The school year period for which FRPM data is reported, formatted
      as YYYY-YYYY.
  - name: enrollment_ages5_17
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: Enrollment (Ages 5-17)
    datatype: Float
    description: Total enrollment count for students aged 5 through 17, stored as
      a real number.
    ai_context:
      synonyms:
      - enrollment(ages5-17)
  - name: high_grade
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: High Grade
    datatype: String
    description: Highest grade level offered by the school, represented as a numeric
      value up to 12.
  - name: free_meal_count_ages5_17
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: Free Meal Count (Ages 5-17)
    datatype: Float
    description: Number of students aged 5 through 17 eligible for free meals, stored
      as a real number.
    ai_context:
      synonyms:
      - freeMealCount(ages5-17)
  - name: charter_school_y_n
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: Charter School (Y/N)
    datatype: Integer
    description: Indicates whether the school is a charter school, with 1.0 for yes
      and 0.0 for no.
    ai_context:
      synonyms:
      - charterSchool(y/n)
  - name: low_grade
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: Low Grade
    datatype: String
    description: Lowest grade level offered by the school, using codes such as K for
      kindergarten and P for pre-kindergarten.
  - name: field_2013_14_calpads_fall1_certification_status
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: 2013-14 CALPADS Fall 1 Certification Status
    datatype: Integer
    description: Certification status code for the 2013-14 CALPADS Fall 1 submission,
      where 1 indicates certified, stored as a bigint.
    ai_context:
      synonyms:
      - 2013-14CalpadsFall1CertificationStatus
  - name: school_code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: School Code
    datatype: String
    description: The seven-digit code uniquely identifying the school within the state.
  - name: irc
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: irc
    datatype: Integer
    description: Indicates whether the school is an Independent Reporting Charter,
      with 1.0 for yes and 0.0 for no.
  - name: free_meal_count_k_12
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: Free Meal Count (K-12)
    datatype: Float
    description: Number of kindergarten through 12th grade students eligible for free
      meals, stored as a real number.
    ai_context:
      synonyms:
      - freeMealCount(k-12)
  - name: district_type
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: District Type
    datatype: String
    description: The classification of the district by grade span and governance type.
  - name: enrollment_k_12
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: Enrollment (K-12)
    datatype: Float
    description: Total student enrollment count for kindergarten through 12th grade,
      stored as a real number.
    ai_context:
      synonyms:
      - enrollment(k-12)
  - name: percent_eligible_frpm_k_12
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: Percent (%) Eligible FRPM (K-12)
    datatype: Float
    description: Proportion of K-12 students eligible for free or reduced-price meals,
      expressed as a decimal between 0 and 1.
    ai_context:
      synonyms:
      - percent(%)EligibleFrpm(k-12)
  - name: county_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: County Name
    datatype: String
    description: The name of the county where the school or district operates.
  - name: percent_eligible_free_ages5_17
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: Percent (%) Eligible Free (Ages 5-17)
    datatype: Float
    description: Proportion of students aged 5 through 17 eligible for free meals,
      expressed as a decimal between 0 and 1.
    ai_context:
      synonyms:
      - percent(%)EligibleFree(ages5-17)
  - name: county_code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: County Code
    datatype: String
    description: The two-digit code identifying the county where the school or district
      is located.
  - name: percent_eligible_frpm_ages5_17
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: Percent (%) Eligible FRPM (Ages 5-17)
    datatype: Float
    description: Proportion of students aged 5 through 17 eligible for free or reduced-price
      meals, expressed as a decimal between 0 and 1.
    ai_context:
      synonyms:
      - percent(%)EligibleFrpm(ages5-17)
  - name: nslp_provision_status
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: NSLP Provision Status
    datatype: String
    description: The National School Lunch Program provision under which the school
      operates for meal reimbursement.
  - name: frpm_count_k_12
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: FRPM Count (K-12)
    datatype: Float
    description: Count of kindergarten through 12th grade students eligible for free
      or reduced-price meals, stored as a real number.
    ai_context:
      synonyms:
      - frpmCount(k-12)
  - name: educational_option_type
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: Educational Option Type
    datatype: String
    description: The specific educational program model offered at the school.
  - name: cdscode
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: cdscode
    datatype: String
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
- name: sat_scores
  source: d2_california_schools.public.satscores
  description: SAT exam performance and participation data for schools and districts.
  fields:
  - name: number_of_test_takers
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: numtsttakr
    datatype: Integer
    description: Counts the 12th-grade students who took the SAT exam.
  - name: numge1500
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: numge1500
    datatype: Integer
    description: Counts test takers with a combined SAT score of 1500 or higher.
  - name: record_type
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: rtype
    datatype: String
    description: Indicates whether the record represents a school ('S') or district
      aggregate ('D').
  - name: average_math_score
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: avgscrmath
    datatype: Integer
    description: Reports the average SAT math score among test takers.
  - name: average_writing_score
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: avgscrwrite
    datatype: Integer
    description: Reports the average SAT writing score among test takers.
  - name: county_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: cname
    datatype: String
    description: Identifies the county by its official name.
  - name: school_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: sname
    datatype: String
    description: Identifies the school by its official name.
  - name: district_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: dname
    datatype: String
    description: Identifies the school district by its official name.
  - name: enroll12
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: enroll12
    datatype: Integer
    description: Counts the number of students enrolled in 12th grade.
  - name: average_reading_score
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: avgscrread
    datatype: Integer
    description: Reports the average SAT reading score among test takers.
  - name: cds
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: cds
    datatype: String
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
- name: school
  source: d2_california_schools.public.schools
  description: A California school or district entity with identifying codes, location,
    contact, operational, and organizational attributes.
  unique_keys:
  - - cds_code
  fields:
  - name: longitude
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: longitude
    datatype: Float
    description: Records the geographic longitude coordinate of the school's physical
      location.
  - name: phone_number
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: phone
    datatype: String
    description: The school's primary telephone number including area code, formatted
      as (XXX) XXX-XXXX.
  - name: educational_operation_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: edopsname
    datatype: String
    description: Identifies the school's educational operation type or model, such
      as Traditional or Continuation School.
  - name: nces_district_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ncesdist
    datatype: String
    description: The National Center for Education Statistics district identifier
      for the school's governing district.
  - name: charter_flag
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: charter
    datatype: Integer
    description: A flag indicating whether the school operates as a charter school
      (1) or not (0).
  - name: instructional_level_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: eilname
    datatype: String
    description: Gives the full descriptive name of the school's instructional level
      matching the eilcode.
  - name: educational_operation_code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: edopscode
    datatype: String
    description: The educational operation code indicating the school's operational
      model, such as TRAD for traditional.
  - name: admfname2
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: admfname2
    datatype: String
    description: Stores the first name of the secondary school administrator.
  - name: grades_offered
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: gsoffered
    datatype: String
    description: Specifies the grade range the school is authorized to offer, formatted
      as K-5 or 9-12.
  - name: mailing_city
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: mailcity
    datatype: String
    description: The city used for mailing correspondence to the school or district.
  - name: phone_extension
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ext
    datatype: String
    description: The phone extension associated with the school's primary telephone
      number.
  - name: school_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: school
    datatype: String
    description: The official name of the school site.
  - name: open_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: opendate
    datatype: Date
    description: The date the school or agency began operations, in YYYY-MM-DD format.
  - name: funding_type
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: fundingtype
    datatype: String
    description: The funding model classification for the school, such as directly
      funded or locally funded.
  - name: district_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: district
    datatype: String
    description: The official name of the school district or county office of education
      that governs the school.
  - name: admemail1
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: admemail1
    datatype: String
    description: Provides the email address of the primary school administrator.
  - name: admemail3
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: admemail3
    datatype: String
    description: The email address of the third administrator linked to the school.
  - name: zip_code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: zip
    datatype: String
    description: The ZIP code for the physical address of the school or district office.
  - name: city
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: city
    datatype: String
    description: The city where the school or district office is physically located.
  - name: website_url
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: website
    datatype: String
    description: The official website URL of the school or agency.
  - name: state
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: state
    datatype: String
    description: The U.S. state abbreviation for the school or district location,
      always CA.
  - name: instructional_level_code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: eilcode
    datatype: String
    description: Provides the coded abbreviation for the school's instructional level,
      like ELEM for Elementary.
  - name: lastupdate
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: lastupdate
    datatype: Date
    description: The date the school record was last updated, in YYYY-MM-DD format.
  - name: district_organization_code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: doc
    datatype: String
    description: A numeric code representing the district or organizational identifier
      for the school.
  - name: admemail2
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: admemail2
    datatype: String
    description: Provides the email address of the secondary school administrator.
  - name: county
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: county
    datatype: String
    description: The California county where the school or district is geographically
      located.
  - name: closed_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: closeddate
    datatype: Date
    description: The date the school or agency ceased operations, in YYYY-MM-DD format.
  - name: mailing_street_address
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: mailstreet
    datatype: String
    description: The mailing street address for the school or district, which may
      differ from the physical address.
  - name: status_type
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: statustype
    datatype: String
    description: The operational status of the school or district, such as Active,
      Closed, Merged, or Pending.
  - name: organization_type
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: doctype
    datatype: String
    description: The type of educational organization, such as Unified School District
      or County Office of Education.
  - name: admlname2
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: admlname2
    datatype: String
    description: Stores the last name of the secondary school administrator.
  - name: charter_number
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: charternum
    datatype: String
    description: The unique charter school identification number assigned to the school.
  - name: admfname3
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: admfname3
    datatype: String
    description: The first name of the third administrator linked to the school.
  - name: cds_code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: cdscode
    datatype: String
    description: A unique 14-digit identifier for a California school or district
      used across state education data systems.
  - name: virtual_instruction_status
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: virtual
    datatype: String
    description: Shows the school's virtual instruction status using codes N, P, or
      F.
  - name: admlname1
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: admlname1
    datatype: String
    description: Stores the last name of the primary school administrator.
  - name: latitude
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: latitude
    datatype: Float
    description: Records the geographic latitude coordinate of the school's physical
      location.
  - name: school_organization_type
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: soctype
    datatype: String
    description: The descriptive category of the school organization, such as Elementary
      Schools or High Schools.
  - name: mailing_state
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: mailstate
    datatype: String
    description: The two-letter state abbreviation for the school's mailing address,
      such as CA.
  - name: mailing_zip_code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: mailzip
    datatype: String
    description: The ZIP code of the school's mailing address, in standard five-digit
      format.
  - name: nces_school_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ncesschool
    datatype: String
    description: The National Center for Education Statistics school identifier for
      the specific school site.
  - name: school_organization_code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: soc
    datatype: String
    description: A numeric school organization code used for classification purposes.
  - name: magnet_flag
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: magnet
    datatype: Integer
    description: Flags whether the school is a magnet school (1) or not (0).
  - name: administrator_first_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: admfname1
    datatype: String
    description: Stores the first name of the primary school administrator.
  - name: street_address_abbreviation
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: streetabr
    datatype: String
    description: The abbreviated physical street address using standard postal abbreviations.
  - name: admlname3
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: admlname3
    datatype: String
    description: The last name of the third administrator linked to the school.
  - name: grades_served
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: gsserved
    datatype: String
    description: Indicates the grade range the school currently serves, formatted
      as K-5 or 9-12.
  - name: street_address
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: street
    datatype: String
    description: The physical street address of the school or district office.
  - name: mailing_street_abbreviation
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: mailstrabr
    datatype: String
    description: The abbreviated mailing street address using standard postal abbreviations.
