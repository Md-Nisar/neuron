version: 0.2.0.dev0
name: d2_financial
datasets:
- name: account
  source: d2_financial.public.account
  description: Customer account with payment frequency details.
  unique_keys:
  - - account_id
  fields:
  - name: account_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: account_id
    datatype: Integer
    description: Unique identifier for a customer account, linking to dispositions,
      loans, orders, and transactions.
  - name: frequency_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: date
    datatype: Date
    description: Calendar date of the account frequency entry, formatted as YYYY-MM-DD.
  - name: frequency
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: frequency
    datatype: String
    description: 'Payment frequency category for the account, with values: monthly
      (POPLATEK MESICNE), weekly (POPLATEK TYDNE), or per-transaction (POPLATEK PO
      OBRATU).'
  - name: district_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: district_id
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
- name: card
  source: d2_financial.public.card
  description: Represents a payment card issued to a customer.
  fields:
  - name: card_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: card_id
    datatype: Integer
    description: Uniquely identifies each payment card issued to a customer.
  - name: card_type
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: type
    datatype: String
    description: Categorizes the card by product tier such as classic, junior, or
      gold.
  - name: issue_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: issued
    datatype: Date
    description: Records the date the card was issued to the customer in YYYY-MM-DD
      format.
  - name: disp_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: disp_id
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
- name: client
  source: d2_financial.public.client
  unique_keys:
  - - client_id
  fields:
  - name: client_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: client_id
    datatype: Integer
    description: Unique identifier for each client, used by disposition records to
      link transactions.
  - name: birth_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: birth_date
    datatype: Date
    description: Client's date of birth, stored in YYYY-MM-DD format.
  - name: gender
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: gender
    datatype: String
    description: Client's gender, recorded as 'M' for male or 'F' for female.
  - name: district_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: district_id
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
- name: disposition
  source: d2_financial.public.disp
  unique_keys:
  - - disposition_id
  fields:
  - name: disposition_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: disp_id
    datatype: Integer
    description: Unique identifier for the disposition linking an account to a client,
      referenced by cards to associate them with the disposition.
  - name: client_role
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: type
    datatype: String
    description: Role of the client in the disposition, either OWNER or DISPONENT,
      indicating account ownership or authorized disposal rights.
  - name: account_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: account_id
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
  - name: client_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: client_id
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
- name: district
  source: d2_financial.public.district
  description: Geographic district with demographic and metric attributes.
  unique_keys:
  - - district_id
  fields:
  - name: district_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: district_id
    datatype: Integer
    description: Uniquely identifies a geographic district and links accounts and
      clients to their respective district.
  - name: a15
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: a15
    datatype: Integer
    description: Stores a large district-level monetary amount or aggregate quantity
      as a bigint, e.g., 2854.
  - name: a5
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: a5
    datatype: String
    description: Contains a district-level metric (percentage or count) stored as
      text, e.g., '60'.
  - name: a9
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: a9
    datatype: Integer
    description: Represents a district-level code or categorical indicator as an integer,
      e.g., 6.
  - name: district_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: a2
    datatype: String
    description: Stores the district's name, such as 'Hl.m. Praha' or 'Benesov'.
  - name: a11
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: a11
    datatype: Integer
    description: Counts district entities or events as a large integer, e.g., 8369.
  - name: a7
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: a7
    datatype: String
    description: Stores a small district-level count or code as text, e.g., '4'.
  - name: population_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: a4
    datatype: String
    description: Holds the district's population count stored as text, e.g., '1204953'.
  - name: a13
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: a13
    datatype: Float
    description: Provides a real-valued district metric like an average or index,
      e.g., 3.6.
  - name: a8
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: a8
    datatype: Integer
    description: Represents a district-level code or categorical indicator as an integer,
      e.g., 1.
  - name: a6
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: a6
    datatype: String
    description: Contains a district-level metric (percentage or count) stored as
      text, e.g., '26'.
  - name: a16
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: a16
    datatype: Integer
    description: Unique numeric identifier for the district.
  - name: a14
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: a14
    datatype: Integer
    description: Counts district occurrences or units as an integer, e.g., 131.
  - name: a10
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: a10
    datatype: Float
    description: Provides a real-valued district metric like a rate or percentage,
      e.g., 100.0.
  - name: a12
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: a12
    datatype: Float
    description: Provides a real-valued district metric like an average or index,
      e.g., 3.3.
  - name: region_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: a3
    datatype: String
    description: Records the region name where the district is located, like 'central
      Bohemia'.
- name: loan
  source: d2_financial.public.loan
  fields:
  - name: loan_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: date
    datatype: Date
    description: Date when the loan was originated or disbursed, formatted as YYYY-MM-DD.
  - name: loan_status
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: status
    datatype: String
    description: Current status code indicating the loan's state.
  - name: loan_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: loan_id
    datatype: Integer
    description: Unique identifier assigned to each loan.
  - name: monthly_payment
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: payments
    datatype: Float
    description: Scheduled monthly payment amount for the loan.
  - name: loan_duration
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: duration
    datatype: Integer
    description: Length of the loan term in months.
  - name: loan_amount
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: amount
    datatype: Integer
    description: Principal loan amount expressed in the smallest currency unit.
  - name: account_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: account_id
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
- name: order
  source: d2_financial.public.order
  fields:
  - name: destination_bank
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: bank_to
    datatype: String
    description: Indicates the destination bank code for the financial transaction.
  - name: order_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: order_id
    datatype: Integer
    description: Uniquely identifies each order transaction in the system.
  - name: transaction_category
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: k_symbol
    datatype: String
    description: Classifies the transaction by payment purpose such as leasing or
      insurance.
  - name: account_to
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: account_to
    datatype: Integer
    description: Identifies the destination account receiving the funds.
  - name: amount
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: amount
    datatype: Float
    description: Represents the monetary value of the transaction in local currency.
  - name: account_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: account_id
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
- name: transaction
  source: d2_financial.public.trans
  fields:
  - name: counterparty_account
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: account
    datatype: Integer
    description: Provides the counterparty account number, with zero meaning internal
      or unspecified.
  - name: category_code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: k_symbol
    datatype: String
    description: Indicates the transaction purpose using codes like salary, services,
      pension, or loan.
  - name: operation
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: operation
    datatype: String
    description: Describes the specific operation performed, such as cash withdrawal,
      deposit, or transfer.
  - name: transaction_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: trans_id
    datatype: Integer
    description: Identifies a specific financial transaction within the system.
  - name: amount
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: amount
    datatype: Integer
    description: States the monetary value of the transaction in the account currency.
  - name: bank
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: bank
    datatype: String
    description: Identifies the financial institution involved in the transaction.
  - name: transaction_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: date
    datatype: Date
    description: Records the processing date of the transaction in YYYY-MM-DD format.
  - name: balance
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: balance
    datatype: Integer
    description: Shows the account balance after applying the transaction.
  - name: transaction_type
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: type
    datatype: String
    description: Classifies the transaction as income, expense, or withdrawal.
  - name: account_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: account_id
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
