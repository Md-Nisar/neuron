- name: order
  source: d3.sales.orders
  description: Sales orders. Only completed orders count as revenue.
  unique_keys:
  - - order_id
  fields:
  - name: ordered_on
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ordered_on
    datatype: Date
    description: Records the date the customer placed the order in YYYY-MM-DD format.
  - name: order_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: order_id
    datatype: Integer
    description: Uniquely identifies each customer order and links to its line items
      and return records.
  - name: status
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: status
    datatype: String
    description: 'Order status: pending, completed or cancelled. Only completed orders
      count as revenue.'
  - name: average_order_value
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(l.quantity * l.unit_price * (1 - l.discount_pct / 100)) /
          COUNT(DISTINCT o.order_id)
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"sql_attribute","id":"f1c79cd2-e702-41c8-adc7-55e4f893e119","ossie_expression":"SUM(l.quantity
        * l.unit_price * (1 - l.discount_pct / 100)) / COUNT(DISTINCT o.order_id)","sql":"SELECT
        SUM(l.quantity * l.unit_price * (1 - l.discount_pct / 100)) / COUNT(DISTINCT
        o.order_id) FROM sales.order_lines l JOIN sales.orders o ON o.order_id = l.order_id
        WHERE o.status = ''completed''","sql_column_is":["51007bc8-1a47-45c6-8d09-e9a8c2d4599a","87b1ff3b-2b77-401a-b26c-79a928f1ebac","982d7a62-8dee-41a1-8ba6-e82bf313df6f","818370ee-6806-46ad-a011-e6afeca3786e","afd964ef-8b14-4d90-b46b-9d166a846676","6f6ce9b5-dfb8-44e7-92e1-925c5477f409"],"sql_source":"manual","term_id":"24c9ce76-3358-4f4e-be2c-5f8347687b52"}'
    description: Revenue divided by the number of completed orders (AOV).
  - name: completed_order_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(o.order_id)
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"sql_attribute","id":"5a4c5a45-6f08-403d-93e2-bbb0b21fdc0a","ossie_expression":"COUNT(o.order_id)","sql":"SELECT
        COUNT(o.order_id) FROM sales.orders o WHERE o.status = ''completed''","sql_column_is":["87b1ff3b-2b77-401a-b26c-79a928f1ebac","6f6ce9b5-dfb8-44e7-92e1-925c5477f409"],"sql_source":"manual","term_id":"24c9ce76-3358-4f4e-be2c-5f8347687b52"}'
    description: Number of completed orders.
  - name: order_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(o.order_id)
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"sql_attribute","id":"9778f803-4ee6-46eb-833c-a586b0893436","ossie_expression":"COUNT(o.order_id)","sql":"SELECT
        COUNT(o.order_id) FROM sales.orders o","sql_column_is":["6f6ce9b5-dfb8-44e7-92e1-925c5477f409"],"sql_source":"manual","term_id":"24c9ce76-3358-4f4e-be2c-5f8347687b52"}'
    description: Number of orders of any status.
  - name: revenue
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(l.quantity * l.unit_price * (1 - l.discount_pct / 100))
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"sql_attribute","id":"6f481878-6195-4147-8a6a-bbd408328352","ossie_expression":"SUM(l.quantity
        * l.unit_price * (1 - l.discount_pct / 100))","sql":"SELECT SUM(l.quantity
        * l.unit_price * (1 - l.discount_pct / 100)) FROM sales.order_lines l JOIN
        sales.orders o ON o.order_id = l.order_id WHERE o.status = ''completed''","sql_column_is":["51007bc8-1a47-45c6-8d09-e9a8c2d4599a","87b1ff3b-2b77-401a-b26c-79a928f1ebac","982d7a62-8dee-41a1-8ba6-e82bf313df6f","818370ee-6806-46ad-a011-e6afeca3786e","afd964ef-8b14-4d90-b46b-9d166a846676","6f6ce9b5-dfb8-44e7-92e1-925c5477f409"],"sql_source":"manual","term_id":"24c9ce76-3358-4f4e-be2c-5f8347687b52"}'
    description: 'Net revenue in USD: net line amounts of completed orders. Returns
