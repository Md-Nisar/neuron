version: 0.2.0.dev0
name: d3
datasets:
- name: assessment
  source: d3.skills.assessments
  description: One score per employee, skill and cycle, given by an assessor (usually
    the line manager).
  fields:
  - name: assessed_on
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: assessed_on
    datatype: Date
    description: Records the calendar date when the assessment was conducted, formatted
      as YYYY-MM-DD.
  - name: assessment_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: assessment_id
    datatype: Integer
    description: Uniquely identifies each assessment evaluation record.
  - name: score
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: score
    datatype: Integer
    description: Represents the numerical rating assigned to an assessment on a 1
      to 5 scale.
  - name: assessment_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(a.assessment_id)
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"sql_attribute","id":"68a0587a-3c2b-415d-a676-de9f3ecf23ad","ossie_expression":"COUNT(a.assessment_id)","sql":"SELECT
        COUNT(a.assessment_id) FROM skills.assessments a","sql_column_is":["b2777083-4aff-4eb3-96e6-d1f6f541ef9e"],"sql_source":"manual","term_id":"8a91aa16-3d58-4758-a1c9-1e45b87e7bbb"}'
    description: Number of assessments.
  - name: average_score
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: AVG(a.score)
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"sql_attribute","id":"a0399141-e199-4465-853e-3f3196111445","ossie_expression":"AVG(a.score)","sql":"SELECT
        AVG(a.score) FROM skills.assessments a","sql_column_is":["ce2dccc1-e9f1-43f5-a429-f4af8d82206e"],"sql_source":"manual","term_id":"8a91aa16-3d58-4758-a1c9-1e45b87e7bbb"}'
    description: Mean assessment score on the 1 to 5 scale.
  - name: employee_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: employee_id
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
  - name: assessor_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: assessor_id
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
  - name: region_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: region_id
    datatype: String
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
  - name: cycle_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: cycle_id
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
  - name: skill_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: skill_id
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
- name: assessment_cycle
  source: d3.skills.assessment_cycles
  description: Half-year assessment cycles, for example 2024-H1.
  unique_keys:
  - - cycle_id
  fields:
  - name: cycle_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: cycle_id
    datatype: Integer
    description: Uniquely identifies each assessment cycle and links to associated
      assessments.
  - name: ends_on
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ends_on
    datatype: Date
    description: Records the official end date of the cycle in YYYY-MM-DD format.
  - name: name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: name
    datatype: String
    description: Provides the cycle's display label in year-half-year format such
      as 2024-H1.
  - name: starts_on
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: starts_on
    datatype: Date
    description: Records the official start date of the cycle in YYYY-MM-DD format.
