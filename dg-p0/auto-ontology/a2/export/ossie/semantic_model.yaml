      data: '{"entity":"key_column"}'
- name: customer
  source: d3.sales.customers
  description: Customers, one row per customer account.
  unique_keys:
  - - customer_id
  fields:
  - name: created_on
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: created_on
    datatype: Date
    description: Date the customer record was first created in the system, formatted
      as YYYY-MM-DD.
  - name: name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: name
    datatype: String
    description: Full legal or display name of the customer, such as Atlas Analytics
      SA or Nova Motors SA.
  - name: segment
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: segment
    datatype: String
    description: Categorization label grouping customers by shared business characteristics
