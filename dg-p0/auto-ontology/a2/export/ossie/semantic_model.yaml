      - dialect: ANSI_SQL
        expression: region_id
    datatype: String
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
- name: product
  source: d3.sales.products
  description: Product catalogue.
  unique_keys:
