        expression: customer_id
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"key_column"}'
- name: order_line
  source: d3.sales.order_lines
  description: Order lines. The net amount of a line is quantity * unit_price * (1
    - discount_pct / 100).
  fields:
  - name: unit_price
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: unit_price
    datatype: Decimal
    description: Numeric standard price per single unit before any discounts are applied.
  - name: quantity
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: quantity
    datatype: Integer
    description: Integer count of product units ordered or sold on this specific line.
  - name: line_number
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: line_no
    datatype: Integer
    description: Sequential integer identifying each line item within an order, referenced
      by returns to link returned items.
  - name: discount_percentage
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: discount_pct
    datatype: Decimal
    description: Numeric percentage discount applied to the line item's unit price.
  - name: net_amount
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: l.quantity * l.unit_price * (1 - l.discount_pct / 100)
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity":"sql_attribute","id":"85e21bd3-386b-4e40-bfb5-bb5b2c2c64cc","ossie_expression":"l.quantity
        * l.unit_price * (1 - l.discount_pct / 100)","sql":"SELECT l.quantity * l.unit_price
        * (1 - l.discount_pct / 100) FROM sales.order_lines l","sql_column_is":["818370ee-6806-46ad-a011-e6afeca3786e","afd964ef-8b14-4d90-b46b-9d166a846676","982d7a62-8dee-41a1-8ba6-e82bf313df6f"],"sql_source":"manual","term_id":"7e241284-4659-42b4-b851-9385d7acd8fa"}'
    description: 'Net amount of an order line in USD: quantity * unit_price * (1 -
