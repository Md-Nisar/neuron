      the career framework.
  - name: hired_on
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: hired_on
    datatype: Date
    description: Date the employee was hired, formatted as YYYY-MM-DD.
  - name: name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: name
    datatype: String
    description: Full legal name of the employee as recorded in HR systems.
  - name: left_on
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: left_on
