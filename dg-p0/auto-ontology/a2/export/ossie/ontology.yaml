version: 0.2.0.dev0
name: d3_ontology
description: Business concepts of the d3 semantic model
ontology:
- concept: Assessment
  type: EntityType
  description: One score per employee, skill and cycle, given by an assessor (usually
    the line manager).
  relationships:
  - name: assessed_on
    description: Records the calendar date when the assessment was conducted, formatted
      as YYYY-MM-DD.
    roles:
    - concept: Date
    multiplicity: ManyToOne
    verbalizes:
    - '{Assessment} has assessed on {Date}'
  - name: assessment_id
    description: Uniquely identifies each assessment evaluation record.
    roles:
    - concept: Integer
    multiplicity: ManyToOne
    verbalizes:
    - '{Assessment} has assessment id {Integer}'
  - name: score
    description: Represents the numerical rating assigned to an assessment on a 1
      to 5 scale.
    roles:
    - concept: Integer
    multiplicity: ManyToOne
    verbalizes:
    - '{Assessment} has score {Integer}'
  - name: employee_id
    roles:
    - concept: Employee
    multiplicity: ManyToOne
    verbalizes:
    - '{Assessment} has {Employee}'
  - name: assessor_id
    roles:
    - concept: Employee
    multiplicity: ManyToOne
    verbalizes:
    - '{Assessment} has {Employee}'
  - name: region
    roles:
    - concept: Region
    multiplicity: ManyToOne
    verbalizes:
    - '{Assessment} has {Region}'
  - name: assessment_cycle
    roles:
    - concept: AssessmentCycle
    multiplicity: ManyToOne
    verbalizes:
    - '{Assessment} has {AssessmentCycle}'
  - name: skill
    roles:
    - concept: Skill
    multiplicity: ManyToOne
    verbalizes:
    - '{Assessment} has {Skill}'
- concept: AssessmentCycle
  type: EntityType
  description: Half-year assessment cycles, for example 2024-H1.
  identify_by:
  - cycle_id
  relationships:
  - name: cycle_id
    description: Uniquely identifies each assessment cycle and links to associated
      assessments.
    roles:
    - concept: Integer
    multiplicity: OneToOne
    verbalizes:
    - '{AssessmentCycle} is identified by cycle id {Integer}'
  - name: ends_on
    description: Records the official end date of the cycle in YYYY-MM-DD format.
    roles:
    - concept: Date
    multiplicity: ManyToOne
    verbalizes:
    - '{AssessmentCycle} has ends on {Date}'
  - name: name
    description: Provides the cycle's display label in year-half-year format such
      as 2024-H1.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{AssessmentCycle} has name {String}'
  - name: starts_on
    description: Records the official start date of the cycle in YYYY-MM-DD format.
    roles:
    - concept: Date
    multiplicity: ManyToOne
    verbalizes:
    - '{AssessmentCycle} has starts on {Date}'
- concept: Certification
  type: EntityType
  description: Professional certifications held by employees.
  relationships:
  - name: expires_on
    description: Date the certification becomes invalid and requires renewal, formatted
      as YYYY-MM-DD.
    roles:
    - concept: Date
    multiplicity: ManyToOne
    verbalizes:
    - '{Certification} has expires on {Date}'
  - name: name
    description: Official title of the professional certification held by an individual.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{Certification} has name {String}'
  - name: certification_id
    description: Unique identifier assigned to each professional certification record.
    roles:
    - concept: Integer
    multiplicity: ManyToOne
    verbalizes:
    - '{Certification} has certification id {Integer}'
  - name: issued_on
    description: Date the certification was granted to the holder, formatted as YYYY-MM-DD.
    roles:
    - concept: Date
    multiplicity: ManyToOne
    verbalizes:
    - '{Certification} has issued on {Date}'
  - name: employee
    roles:
    - concept: Employee
    multiplicity: ManyToOne
    verbalizes:
    - '{Certification} has {Employee}'
  - name: region
    roles:
    - concept: Region
    multiplicity: ManyToOne
    verbalizes:
    - '{Certification} has {Region}'
- concept: Country
  type: EntityType
  description: Countries and the sales region each belongs to.
  identify_by:
  - country_code
  relationships:
  - name: country_code
    description: Unique ISO country code (2-3 characters) identifying each nation,
      used to link customers to their country.
    roles:
    - concept: String
    multiplicity: OneToOne
    verbalizes:
    - '{Country} is identified by country code {String}'
  - name: country_name
    description: Full official country name in text format, such as Germany or United
      Arab Emirates.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{Country} has country name {String}'
  - name: region
    roles:
    - concept: Region
    multiplicity: ManyToOne
    verbalizes:
    - '{Country} has {Region}'
- concept: Customer
  type: EntityType
  description: Customers, one row per customer account.
  identify_by:
  - customer_id
  relationships:
  - name: created_on
    description: Date the customer record was first created in the system, formatted
      as YYYY-MM-DD.
    roles:
    - concept: Date
    multiplicity: ManyToOne
    verbalizes:
    - '{Customer} has created on {Date}'
  - name: name
    description: Full legal or display name of the customer, such as Atlas Analytics
      SA or Nova Motors SA.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{Customer} has name {String}'
  - name: segment
    description: Categorization label grouping customers by shared business characteristics
      like value tier or behavior, e.g., SMB, Consumer, Enterprise.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{Customer} has segment {String}'
  - name: customer_id
    description: Unique integer identifier for each customer, used to link orders
      to the customer who placed them.
    roles:
    - concept: Integer
    multiplicity: OneToOne
    verbalizes:
    - '{Customer} is identified by customer id {Integer}'
  - name: region
    roles:
    - concept: Region
    multiplicity: ManyToOne
    verbalizes:
    - '{Customer} has {Region}'
  - name: country
    roles:
    - concept: Country
    multiplicity: ManyToOne
    verbalizes:
    - '{Customer} has {Country}'
- concept: Department
  type: EntityType
  description: Departments; each sits in one region.
  identify_by:
  - department_id
  relationships:
  - name: department_name
    description: Department name combined with its geographic region, such as Engineering
      EMEA or Support APAC.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{Department} has department name {String}'
  - name: department_id
    description: Unique identifier for each department, referenced by employees to
      indicate their assigned department.
    roles:
    - concept: Integer
    multiplicity: OneToOne
    verbalizes:
    - '{Department} is identified by department id {Integer}'
  - name: region
    roles:
    - concept: Region
    multiplicity: ManyToOne
    verbalizes:
    - '{Department} has {Region}'
- concept: Employee
  type: EntityType
  description: Employees, current and former. An employee is current when left_on
    is empty.
  identify_by:
  - employee_id
  relationships:
  - name: level
    description: Numeric grade representing the employee's seniority level within
      the career framework.
    roles:
    - concept: Integer
    multiplicity: ManyToOne
    verbalizes:
    - '{Employee} has level {Integer}'
  - name: hired_on
    description: Date the employee was hired, formatted as YYYY-MM-DD.
    roles:
    - concept: Date
    multiplicity: ManyToOne
    verbalizes:
    - '{Employee} has hired on {Date}'
  - name: name
    description: Full legal name of the employee as recorded in HR systems.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{Employee} has name {String}'
  - name: left_on
    description: Date the employee left; empty means the employee is still employed.
    roles:
    - concept: Date
    multiplicity: ManyToOne
    verbalizes:
    - '{Employee} has left on {Date}'
  - name: employee_id
    description: Unique identifier for each employee, used to link assessments, certifications,
      and reporting relationships.
    roles:
    - concept: Integer
    multiplicity: OneToOne
    verbalizes:
    - '{Employee} is identified by employee id {Integer}'
  - name: job_title
    description: Current role or position held by the employee within the organization.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{Employee} has job title {String}'
  - name: employee
    roles:
    - concept: Employee
      name: employee
    multiplicity: ManyToOne
    verbalizes:
    - '{Employee} has {Employee:employee}'
  - name: region
    roles:
    - concept: Region
    multiplicity: ManyToOne
    verbalizes:
    - '{Employee} has {Region}'
  - name: department
    roles:
    - concept: Department
    multiplicity: ManyToOne
    verbalizes:
    - '{Employee} has {Department}'
- concept: Order
  type: EntityType
  description: Sales orders. Only completed orders count as revenue.
  identify_by:
  - order_id
  relationships:
  - name: ordered_on
    description: Records the date the customer placed the order in YYYY-MM-DD format.
    roles:
    - concept: Date
    multiplicity: ManyToOne
    verbalizes:
    - '{Order} has ordered on {Date}'
  - name: order_id
    description: Uniquely identifies each customer order and links to its line items
      and return records.
    roles:
    - concept: Integer
    multiplicity: OneToOne
    verbalizes:
    - '{Order} is identified by order id {Integer}'
  - name: status
    description: 'Order status: pending, completed or cancelled. Only completed orders
      count as revenue.'
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{Order} has status {String}'
  - name: sales_rep
    roles:
    - concept: SalesRep
    multiplicity: ManyToOne
    verbalizes:
    - '{Order} has {SalesRep}'
  - name: region
    roles:
    - concept: Region
    multiplicity: ManyToOne
    verbalizes:
    - '{Order} has {Region}'
  - name: customer
    roles:
    - concept: Customer
    multiplicity: ManyToOne
    verbalizes:
    - '{Order} has {Customer}'
- concept: OrderLine
  type: EntityType
  description: Order lines. The net amount of a line is quantity * unit_price * (1
    - discount_pct / 100).
  relationships:
  - name: unit_price
    description: Numeric standard price per single unit before any discounts are applied.
    roles:
    - concept: Decimal
    multiplicity: ManyToOne
    verbalizes:
    - '{OrderLine} has unit price {Decimal}'
  - name: quantity
    description: Integer count of product units ordered or sold on this specific line.
    roles:
    - concept: Integer
    multiplicity: ManyToOne
    verbalizes:
    - '{OrderLine} has quantity {Integer}'
  - name: line_number
    description: Sequential integer identifying each line item within an order, referenced
      by returns to link returned items.
    roles:
    - concept: Integer
    multiplicity: ManyToOne
    verbalizes:
    - '{OrderLine} has line number {Integer}'
  - name: discount_percentage
    description: Numeric percentage discount applied to the line item's unit price.
    roles:
    - concept: Decimal
    multiplicity: ManyToOne
    verbalizes:
    - '{OrderLine} has discount percentage {Decimal}'
  - name: order
    roles:
    - concept: Order
    multiplicity: ManyToOne
    verbalizes:
    - '{OrderLine} has {Order}'
  - name: product
    roles:
    - concept: Product
    multiplicity: ManyToOne
    verbalizes:
    - '{OrderLine} has {Product}'
  - name: region
    roles:
    - concept: Region
    multiplicity: ManyToOne
    verbalizes:
    - '{OrderLine} has {Region}'
- concept: Product
  type: EntityType
  description: Product catalogue.
  identify_by:
  - product_id
  relationships:
  - name: product_id
    description: Uniquely identifies each product in the catalog and links to order
      lines showing where the product appears in customer orders.
    roles:
    - concept: Integer
    multiplicity: OneToOne
    verbalizes:
    - '{Product} is identified by product id {Integer}'
  - name: list_price
    description: States the standard retail price of the product, expressed as a decimal
      number with two decimal places.
    roles:
    - concept: Decimal
    multiplicity: ManyToOne
    verbalizes:
    - '{Product} has list price {Decimal}'
  - name: name
    description: Provides the customer-facing product name used in catalogs and sales
      communications.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{Product} has name {String}'
  - name: category
    description: Groups products into business categories such as Hardware, Software,
      Services, or Accessories for reporting and navigation.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{Product} has category {String}'
- concept: Region
  type: EntityType
  description: Sales regions (EMEA, APAC, AMER). Departments and employees also belong
    to a region.
  identify_by:
  - region_id
  relationships:
  - name: region_id
    description: A unique text code (e.g., EMEA, APAC, AMER) that identifies a geographic
      region and is referenced by assessments, certifications, countries, customers,
      departments, and other entities.
    roles:
    - concept: String
    multiplicity: OneToOne
    verbalizes:
    - '{Region} is identified by region id {String}'
  - name: region_name
    description: The human-readable name of the geographic region, such as Europe,
      Middle East and Africa, Asia Pacific, or Americas.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{Region} has region name {String}'
- concept: Return
  type: EntityType
  description: Returned units against an order line.
  relationships:
  - name: reason
    description: Captures the customer's stated reason for returning the item.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{Return} has reason {String}'
  - name: quantity
    description: Indicates the number of items returned in the transaction.
    roles:
    - concept: Integer
    multiplicity: ManyToOne
    verbalizes:
    - '{Return} has quantity {Integer}'
  - name: returned_on
    description: Records the date the return was processed or received in YYYY-MM-DD
      format.
    roles:
    - concept: Date
    multiplicity: ManyToOne
    verbalizes:
    - '{Return} has returned on {Date}'
  - name: return_id
    description: Uniquely identifies each return transaction with a numeric code.
    roles:
    - concept: Integer
    multiplicity: ManyToOne
    verbalizes:
    - '{Return} has return id {Integer}'
  - name: order_line
    roles:
    - concept: OrderLine
    multiplicity: ManyToOne
    verbalizes:
    - '{Return} has {OrderLine}'
  - name: region
    roles:
    - concept: Region
    multiplicity: ManyToOne
    verbalizes:
    - '{Return} has {Region}'
  - name: order
    roles:
    - concept: Order
    multiplicity: ManyToOne
    verbalizes:
    - '{Return} has {Order}'
- concept: RoleRegion
  type: EntityType
  description: Access-control mapping of database roles to regions. Not business data;
    do not use it to answer questions.
  relationships:
  - name: region
    roles:
    - concept: Region
    multiplicity: ManyToOne
    verbalizes:
    - '{RoleRegion} has {Region}'
- concept: RoleTarget
  type: EntityType
  description: Expected score per job title and skill.
  relationships:
  - name: target_score
    description: Specifies the performance rating goal for a role on a 2-to-5 scale,
      such as 4 or 5.
    roles:
    - concept: Integer
    multiplicity: ManyToOne
    verbalizes:
    - '{RoleTarget} has target score {Integer}'
  - name: job_title
    description: Identifies the specific role or position name, such as Team Lead
      or Engineer, associated with performance targets.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{RoleTarget} has job title {String}'
  - name: skill
    roles:
    - concept: Skill
    multiplicity: ManyToOne
    verbalizes:
    - '{RoleTarget} has {Skill}'
- concept: SalesRep
  type: EntityType
  description: Sales representatives; each works in one region.
  identify_by:
  - rep_id
  relationships:
  - name: name
    description: Records the full legal or preferred name of the sales representative.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{SalesRep} has name {String}'
  - name: rep_id
    description: Uniquely identifies each sales representative and links to the orders
      they manage.
    roles:
    - concept: Integer
    multiplicity: OneToOne
    verbalizes:
    - '{SalesRep} is identified by rep id {Integer}'
  - name: hired_on
    description: Indicates the date the sales representative was hired, formatted
      as YYYY-MM-DD.
    roles:
    - concept: Date
    multiplicity: ManyToOne
    verbalizes:
    - '{SalesRep} has hired on {Date}'
  - name: region
    roles:
    - concept: Region
    multiplicity: ManyToOne
    verbalizes:
    - '{SalesRep} has {Region}'
- concept: Skill
  type: EntityType
  description: Skills that employees are assessed on.
  identify_by:
  - skill_id
  relationships:
  - name: skill_category
    description: Functional grouping that classifies the skill by professional domain
      or type, such as Technical or Leadership.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{Skill} has skill category {String}'
  - name: skill_id
    description: Unique numeric identifier for a skill, used to link assessments and
      role targets to the specific capability.
    roles:
    - concept: Integer
    multiplicity: OneToOne
    verbalizes:
    - '{Skill} is identified by skill id {Integer}'
  - name: skill_name
    description: Descriptive title of the skill, such as a technology, methodology,
      or competency (e.g., Python, SQL).
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{Skill} has skill name {String}'
