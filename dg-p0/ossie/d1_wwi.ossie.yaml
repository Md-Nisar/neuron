metrics:
  - name: gross_margin_pct
    expression: {sql: 100 * SUM(invoice_lines.line_profit) / SUM(invoice_lines.amount_excluding_tax)}
    datatype: Decimal
    description: Profit as a percentage of invoiced sales before tax.
  - name: average_invoice_value
    expression: {sql: SUM(invoice_lines.amount_excluding_tax) / COUNT(DISTINCT invoices.invoice_id)}
    datatype: Decimal
    description: Invoiced sales before tax divided by the number of invoices.

nonportable_extensions:
  - vendor_name: neuron
    data:
      certified_by: "Claude, DG-00.02; owner to confirm"
      certified_terms: [customers, orders, order_lines, invoices, invoice_lines, stock_items, stock_groups,
        suppliers, purchase_orders, invoice_lines.sales_excluding_tax, invoice_lines.profit,
        invoice_lines.units_invoiced, orders.order_count, invoices.invoice_count,
        customer_transactions.amount_outstanding, gross_margin_pct, average_invoice_value]
