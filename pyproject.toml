[project]
name = "neuron-agent"
version = "0.1.0"
description = "Production-oriented LangChain/LangGraph agent service baseline"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi>=0.125.0",
    "langchain>=1.3.10",
    "langchain-openai>=1.1.6",
    "langgraph>=1.0.0",
    "langsmith>=0.5.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.0",
    "structlog>=25.5.0",
    "uvicorn[standard]>=0.38.0",
]

[project.optional-dependencies]
eval = [
    "langsmith>=0.5.0",
]

[project.scripts]
neuron-api = "neuron_agent.api.main:main"
neuron-eval = "neuron_agent.evaluation:main"

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.12.0",
    "bandit>=1.9.2",
    "httpx>=0.28.0",
    "langgraph-cli[inmem]>=0.4.10",
    "mypy>=1.19.0",
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.0",
    "types-requests>=2.32.0",
]

[tool.uv.build-backend]
module-name = "neuron_agent"
source-include = [
    "langgraph.json",
    ".env.example",
    "Makefile",
    "tests/**",
    "docs/**",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "S", "UP", "W"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["neuron_agent"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "integration: tests that require external services or credentials",
    "eval: deterministic agent quality regression checks",
]
