[project]
name = "neuron-agent"
version = "0.7.0"
description = "Production-oriented LangChain/LangGraph agent service baseline"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Md Nisar Ahmed", email = "nisar.a@entomo.co" },
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi>=0.125.0",
    "httpx2>=2.12.0",
    "langchain>=1.4.7",
    "langchain-anthropic>=1.7.6",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langgraph-sdk>=0.4.4",
    "langsmith>=0.14.13",
    "mcp>=2.3.0",
    "openai>=3.6.0",
    "opentelemetry-api>=1.42.1",
    "opentelemetry-exporter-otlp-proto-http>=1.42.1",
    "opentelemetry-instrumentation-fastapi>=0.63b1",
    "opentelemetry-sdk>=1.42.1",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.12.0",
    "pyjwt[crypto]>=2.15.1",
    "python-dotenv>=1.2.0",
    "sse-starlette>=3.3.4",
    "structlog>=25.5.0",
    "uvicorn[standard]>=0.38.0",
]

[project.optional-dependencies]
eval = [
    "langsmith>=0.5.0",
]

[project.scripts]
neuron-api = "neuron_agent.api.main:main"
neuron-eval = "neuron_agent.evaluation:main"
neuron-mcp-pin = "neuron_agent.tools.mcp.pin:main"

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.12.0",
    "bandit>=1.9.2",
    "httpx>=0.28.0",
    "jsonschema>=4.26.0",
    "langgraph-api>=0.15.4",
    "langgraph-cli[inmem]>=0.4.33",
    "mypy>=1.19.0",
    "pip-audit>=2.9.0",
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "pyyaml>=6.0",
    "ruff>=0.14.0",
    "types-requests>=2.32.0",
]

[tool.uv]
# langgraph-api (dev group) caps opentelemetry-exporter-prometheus below 0.64, which pins
# opentelemetry-sdk 1.42 and so holds opentelemetry-api at the vulnerable 1.42.1 for the whole
# lock, including the runtime image. The cap only matters to `langgraph dev`; override it.
override-dependencies = ["opentelemetry-exporter-prometheus>=0.66b1"]

[tool.uv.build-backend]
module-name = "neuron_agent"
source-include = [
    "langgraph.json",
    ".env.example",
    "Makefile",
    "tests/**",
    "docs/**",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "S", "UP", "W"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["neuron_agent"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
# Live suites (`integration`) run only when selected explicitly (`make test-integration`,
# `make eval`); the deterministic `eval` harness tests run by default.
addopts = "-q --strict-markers --strict-config -m 'not integration'"
testpaths = ["tests"]
markers = [
    "integration: tests that require external services or credentials",
    "postgres: tests that need a live Postgres (APP_TEST_POSTGRES_DSN); run by the postgres-integration CI job",
    "docker: tests that need a built container image (NEURON_TEST_IMAGE, default neuron-test); skipped without Docker",
    "eval: deterministic agent quality regression checks",
]

[tool.mutmut]
# Mutation testing of the security-critical code (.github/workflows/mutation-testing.yml).
# mutmut copies only source_paths into mutants/ and puts that copy first on sys.path, so the whole
# package must be a source path or the tests cannot import neuron_agent.api; only_mutate limits mutation.
source_paths = ["src"]
only_mutate = ["src/neuron_agent/security/*", "src/neuron_agent/tools/*"]
pytest_add_cli_args_test_selection = ["tests/security/", "tests/unit/"]
# mutmut already copies tests/, pyproject.toml and uv.lock into mutants/; listing tests/conftest.py
# or tests/fixtures/ here crashes, because they are copied before mutants/tests/ exists.
also_copy = [
  "scripts/", "deploy/", ".github/", "docs/", ".env.example", "langgraph.json",
  "Dockerfile", ".dockerignore", ".trivyignore.yaml", "render.yaml",
  "OPERATIONS.md", "SECURITY.md", "CHANGELOG.md",
]
